<title>Cubicaje App</title>
</head>
<body>
<script>
/* ===== VERSION =====
   UNICA fuente de verdad. Al tocar el archivo, subir APP_VER y APP_FECHA.
   El encabezado la lee de aca, no hay que cambiarla en dos lados. */
var APP_VER='1.1';
var APP_FECHA='30/07/2026';
(function(){
 var stored=localStorage.getItem('cubicaje_app_version');
 if(stored&&stored!==APP_VER){
  localStorage.setItem('cubicaje_app_version',APP_VER);
  window.__appActualizada=stored; // version anterior, para avisar en pantalla
  console.log('App actualizada de v'+stored+' a v'+APP_VER);
 }else if(!stored){
  localStorage.setItem('cubicaje_app_version',APP_VER);
 }
})();
</script>
<style>
:root{--bg:#f5f3ee;--surface:#fff;--primary:#2d5016;--primaryL:#e8f0e4;--accent:#c8982a;--accentL:#fefbf0;--text:#1a1a1a;--textS:#666;--border:#e0ddd6;--danger:#c62828;--dangerBg:#fce8e8;--success:#2e7d32;--successBg:#e8f5e9;--r:10px;--sh:0 1px 4px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body,html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:var(--text);background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px}
.hdr{background:var(--primary);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:16px;font-weight:700;flex:1;margin:0}
.hdr-sub{font-size:11px;opacity:.8}
.hbtn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin:8px 12px;padding:12px;box-shadow:var(--sh)}
.card-accent{background:var(--accentL);border-color:var(--accent)}
.card-green{background:var(--primaryL);border-color:var(--primary)}
.card-dark{background:var(--primary);color:#fff;border:none}
.lbl{font-size:11px;font-weight:700;color:var(--textS);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;display:block}
input[type=text],input[type=number],select{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);font-size:15px;background:#fafaf8;-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
select{padding-right:24px}
.btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;width:100%;text-align:center;display:block}
.btn-sm{padding:7px 12px;font-size:13px;width:auto;display:inline-block}
.btn-out{background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;width:100%;text-align:left}
/* display:none en un input dentro de un <label> falla en algunos navegadores
   de celular (no abre camara/galeria al tocar). Se oculta asi en vez de eso. */
.file-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.btn-x{background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tabs{display:flex;overflow-x:auto;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 6px}
.tabs button{padding:9px 12px;font-size:12px;font-weight:500;color:var(--textS);border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;background:none}
.tabs button.act{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.cono-bar{display:flex;gap:3px}
.cono-btn{flex:1;padding:7px 2px;border-radius:7px;font-size:16px;border:1px solid var(--border);background:#fff;cursor:pointer;text-align:center;line-height:1}
.cono-btn.act{border:2px solid var(--primary);background:var(--primaryL)}
.cono-btn small{display:block;font-size:8px;color:var(--textS);margin-top:2px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;vertical-align:middle;margin-left:4px}
.empty{text-align:center;padding:36px 20px;color:var(--textS)}

/* ===== CALCULATIONS ===== */
function calcCil(silo,e,pe){
 if(!e||!e.grano||e.grano==='VACIO')return{m3:0,kg:0};
 const r=silo.diametro/2,a=Math.PI*r*r;
 // Algunos silos tienen la tolva de abajo mas angosta que el cilindro.
 // Si el silo declara diametroCono, el cono inferior usa ese diametro.
 const rc=(silo.diametroCono||silo.diametro)/2, ac=Math.PI*rc*rc;
 const pctCono=(e.pctCono!=null?e.pctCono:100)/100;
 const vc=(1/3)*ac*(silo.profCono||0)*pctCono;
 const pctFalda=(e.pctFalda!=null?e.pctFalda:100)/100;
 const vfalda=a*(silo.falda||0)*pctFalda;
 const vcil=(e.chapasLlenas||0)*silo.altChapa*a;
 const vs=(e.cono||0)*(1/3)*a*(silo.altConoSup||0);
 const m3=Math.max(0,vc+vfalda+vcil+vs);
 return{m3,kg:m3*(pe||0)};
}
function calcSB(e,kgm){
 if(!e||!e.grano||!e.metros)return{kg:0};
 return{kg:e.metros*(kgm||0)};
}
function calcCelda(c,e,pe,peTrigo){
 if(!e||!e.grano||e.grano==='VACIO')return{kg:0,capTn:c.capacidad||0};
 const capTn=c.capacidad||0;
 if(e.tnDirecto)return{kg:e.tnDirecto*1000,capTn};
 const met=e.metodo||'capacidad';
 if(met==='capacidad'&&capTn){
 const factor=(pe||0)/(peTrigo||800);
 const capGrano=capTn*factor;
 return{kg:capGrano*((e.pctLleno||0)/100)*1000,capTn,capGranoTn:capGrano};
 }
 if(met==='medidas'){
 const L=e.largoLocal||c.largo||0,W=e.anchoLocal||c.ancho||0;
 const altG=e.altGrano||0;
 const profC=c.profConoCelda||0;
 const altLomo=e.altLomo||0;
 const altDep=e.altDepresion||0;
 const vRect=L*W*altG;
 const vCono=(altG>0||profC>0)?(1/3)*L*W*profC:0;
 // Divisor del copete segun la forma que hace el grano en esa celda:
 //   /2 -> caballete (cresta de punta a punta, celdas alargadas)
 //   /3 -> piramide  (un solo pico al centro, celdas cuadradas)
 // Se respeta lo que usa la planilla de cada cooperativa. Por defecto /3.
 const dv=(c.lomoDiv===2)?2:3;
 // El copete puede no ocupar todo el largo de la celda: si la celda declara
 // un largoLomo propio se usa ese, si no el largo completo.
 const Ll=c.largoLomo||L;
 const vLomo=altLomo>0?(1/dv)*Ll*W*altLomo:0;
 const vDep=altDep>0?(1/dv)*Ll*W*altDep:0;
 const volLomoExtra=c.volLomo?(c.volLomo*((e.pctLomo!=null?e.pctLomo:0)/100)):0;
 return{kg:(vRect+vCono+vLomo-vDep+volLomoExtra)*(pe||0),capTn};
 }
 return{kg:0,capTn};
}
function calcOtro(e){return{kg:((e&&e.tnDirecto)||0)*1000};}

/* ===== NUMEROS: acepta coma o punto como decimal ===== */
// Algunos celulares muestran coma en el teclado numerico. Esta funcion
// acepta ambos sin romper nada: si escriben con punto sigue funcionando igual.
function numVal(v){
 if(v==null||v==='')return null;
 // Los campos numericos son type="text" porque el teclado del iPhone da COMA
 // y no punto; un input type="number" descartaria la coma. Aca se acepta
 // cualquiera de las dos y se limpia lo que no sea numero.
 let t=String(v).trim().replace(/\s/g,'').replace(',','.');
 t=t.replace(/[^0-9.\-]/g,'');
 if(t===''||t==='-'||t==='.')return null;
 const n=Number(t);
 return isNaN(n)?null:n;
}

/* ===== ESCAPE HTML ===== */
// Convierte caracteres especiales para que un texto con comillas o < > no rompa la pantalla
function esc(s){
 if(s==null)return '';
 return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ===== COMPRESION DE FOTOS ===== */
// Reduce el tamano de las fotos antes de guardar (max 1280px, calidad 70%)
// Una foto de ~5MB queda en ~150KB. Evita saturar el almacenamiento.
function comprimirFoto(file,cb){
 const reader=new FileReader();
 reader.onload=(e)=>{
  const img=new Image();
  img.onload=()=>{
   const MAX=1280;
   let w=img.width,h=img.height;
   if(w>MAX||h>MAX){
    if(w>h){h=Math.round(h*MAX/w);w=MAX;}
    else{w=Math.round(w*MAX/h);h=MAX;}
   }
   const canvas=document.createElement('canvas');
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
   ctx.drawImage(img,0,0,w,h);
   try{cb(canvas.toDataURL('image/jpeg',0.7));}
   catch(err){cb(e.target.result);} // si falla, usa la original
  };
  img.onerror=()=>cb(e.target.result);
  img.src=e.target.result;
 };
 reader.onerror=()=>alert('No se pudo leer la foto.');
 reader.readAsDataURL(file);
}

/* ===== STORAGE (with localStorage fallback) ===== */
const hasClaudeStorage=typeof window.storage!=='undefined'&&window.storage?.get;
/* Estado del ultimo guardado. Si falla hay que AVISAR: el auditor puede
   seguir cargando datos creyendo que se guardan cuando en realidad se pierden. */
let __saveFail=null;      // null | 'ESPACIO' | 'ERROR'
let __saveAvisado=false;  // para no repetir el alert en cada tecla
async function sGet(k,fb){
 try{
 if(hasClaudeStorage){const r=await window.storage.get(k);return r?JSON.parse(r.value):fb;}
 const v=localStorage.getItem('cb_'+k);return v?JSON.parse(v):fb;
 }catch{return fb}
}
async function sSet(k,v){
 try{
 if(hasClaudeStorage){await window.storage.set(k,JSON.stringify(v));}
 else{localStorage.setItem('cb_'+k,JSON.stringify(v));}
 __saveFail=null;
 return true;
 }catch(e){
 console.error('Fallo al guardar:',e);
 const txt=String(e&&(e.name||'')+' '+(e&&e.message||''));
 __saveFail=/quota|exceeded|full|NS_ERROR_DOM_QUOTA/i.test(txt)?'ESPACIO':'ERROR';
 return false;
 }
}
/* Aviso visible cuando no se pudo guardar. */
function avisarFalloGuardado(){
 if(__saveAvisado)return;
 __saveAvisado=true;
 const msg=__saveFail==='ESPACIO'
 ?'NO SE PUDO GUARDAR\n\nEl almacenamiento del navegador esta lleno.\n\nLO ULTIMO QUE CARGASTE NO QUEDO GUARDADO.\n\nQue hacer AHORA:\n1) Exporta el cubicaje (Backup / Enviar a companero)\n2) Borra fotos que no necesites\n3) Volve a cargar el dato\n\nLas fotos son lo que mas espacio ocupa.'
 :'NO SE PUDO GUARDAR\n\nOcurrio un error al guardar los datos.\n\nExporta el cubicaje cuanto antes para no perder el trabajo.';
 setTimeout(()=>alert(msg),50);
}
async function sDel(k){
 try{
 if(hasClaudeStorage){await window.storage.delete(k);}
 else{localStorage.removeItem('cb_'+k);}
 }catch{}
}

/* ===== TOTALS CALCULATION ===== */
function calcPlantTotals(plantas,data,config){
 const t={};
 (plantas||[]).forEach(p=>{
 const bg={};
 (p.silos||[]).forEach(s=>{
 if(s.tipo==='cilindrico'||!s.tipo){
 const e=data.entries?.[s.id];
 if(e?.grano&&e.grano!=='VACIO'){const pe=e.peLocal||getPE(e.grano,data,config);const{kg}=calcCil(s,e,pe);bg[e.grano]=(bg[e.grano]||0)+kg;}
 }else if(s.tipo==='celda'){
 const e=data.celdaEntries?.[s.id];
 if(e?.grano&&e.grano!=='VACIO'){const pe=e.peLocal||getPE(e.grano,data,config);const peT=getPE('TRIGO',data,config);const{kg}=calcCelda(s,e,pe,peT);bg[e.grano]=(bg[e.grano]||0)+kg;}
 }else if(s.tipo==='silobolsa'){
 const e=data.entries?.[s.id];
 if(e?.grano&&e?.metros){const kgm=getKGM(e.grano,data,config);const{kg}=calcSB(e,kgm);bg[e.grano]=(bg[e.grano]||0)+kg;}
 }else if(s.tipo==='otro'){
 const e=data.entries?.[s.id];
 if(e?.grano&&e.grano!=='VACIO'&&e?.tnDirecto){bg[e.grano]=(bg[e.grano]||0)+e.tnDirecto*1000;}
 }
 });
 (data.silobolsas?.[p.id]||[]).forEach(sb=>{
 if(sb?.grano&&sb?.metros){const kgm=sb.kgmLocal||getKGM(sb.grano,data,config);const{kg}=calcSB(sb,kgm);bg[sb.grano]=(bg[sb.grano]||0)+kg;}
 });
 (data.otrosExtra?.[p.id]||[]).forEach(ot=>{
 if(ot?.grano&&ot.grano!=='VACIO'&&ot?.tnDirecto){bg[ot.grano]=(bg[ot.grano]||0)+ot.tnDirecto*1000;}
 });
 t[p.id]={byGrano:bg,libros:data.libros?.[p.id]||{},arca:data.arca?.[p.id]||{}};
 });
 return t;
}

/* ===== COMPARACION CUBICAJE vs LIBROS/ARCA =====
   Distinguimos tres estados, no dos:
     - campo vacio  -> SIN DATO: no lo entregaron. No se calcula diferencia.
     - campo en 0   -> DATO REAL: informaron cero. Todo el fisico es sobrante.
     - campo con nro-> DATO REAL: se compara normalmente.
   Tratar el vacio como cero inflaba las diferencias y disparaba
   recomendaciones falsas. */
function tieneDato(o,g){
 if(!o)return false;
 const v=o[g];
 return v!=null&&v!==''&&!isNaN(Number(v));
}
/* ¿La planta entrego algun valor? (un 0 cuenta como entregado) */
function hayAlgunDato(o){
 return !!o&&Object.keys(o).some(g=>tieneDato(o,g));
}
/* Suma el cubicaje SOLO de los cereales que tienen contraparte cargada, para
   que el TOTAL compare lo mismo de los dos lados. */
function totalPareado(granos,byGrano,ref){
 let cub=0,rf=0,n=0;
 (granos||[]).forEach(g=>{
  if(tieneDato(ref,g)){cub+=(byGrano?.[g]||0)/1000;rf+=Number(ref[g]);n++;}
 });
 return{cub,ref:rf,n};
}
/* Cereales cubicados que no tienen contraparte cargada (para observaciones). */
function granosSinDato(granos,byGrano,ref){
 return (granos||[]).filter(g=>!tieneDato(ref,g)&&(byGrano?.[g]||0)>0);
}
/* Porcentaje de desvio. Si la referencia es 0 no existe el %, se informa
   aparte como sobrante total. */
function pctODash(dif,ref){
 return Number(ref)===0?'&mdash;':fPct(dif/ref);
}

/* ===== SILOBOLSAS: parser de metros =====
   Acepta sumas y multiplicaciones para no tener que escribir
   75+75+75+75 cuando hay varias bolsas iguales.
     "4x75"          -> 4 bolsas de 75 m  = 300 m
     "4x75+3x60+40"  -> 8 bolsas          = 520 m
     "60+60+40"      -> 3 bolsas          = 160 m  (formato viejo, sigue andando)
   Convencion FIJA: cantidad x metros. Siempre se muestra el desglose
   en pantalla para que el auditor vea si lo escribio al reves. */
function parseSegmentos(txt){
 // La coma tiene dos usos: decimal (62,5) y separador (75, 75, 60).
 // Regla: pegada a los digitos = decimal; seguida de espacio = separador.
 // Asi ninguno de los dos se pierde en silencio.
 const partes=String(txt||'').replace(/;/g,'+').replace(/,(?=\s)/g,'+').split('+');
 let metros=0,cantidad=0;const detalle=[];
 partes.forEach(p=>{
  const t=p.trim();if(!t)return;
  const m=t.match(/^(\d+(?:[.,]\d+)?)\s*[xX*]\s*(\d+(?:[.,]\d+)?)$/);
  if(m){
   const n=parseFloat(m[1].replace(',','.')),met=parseFloat(m[2].replace(',','.'));
   if(!isNaN(n)&&!isNaN(met)&&n>0){metros+=n*met;cantidad+=n;detalle.push({n,met});}
  }else{
   const v=parseFloat(t.replace(',','.'));
   if(!isNaN(v)){metros+=v;cantidad+=1;detalle.push({n:1,met:v});}
  }
 });
 return{metros:Math.round(metros*100)/100,cantidad,detalle};
}
/* Texto legible del desglose, ej: "4 x 75 m + 3 x 60 m + 40 m" */
function desgloseSB(det){
 return (det||[]).map(x=>x.n>1?(x.n+' x '+x.met+' m'):(x.met+' m')).join('  +  ');
}

/* ===== CAPTURA DE FOTOS =====
   Dos botones en vez de un "Elegir archivo":
     Camara  -> capture="environment" abre DIRECTO la camara trasera del celu
     Galeria -> sin capture, permite elegir una foto ya sacada o recibida
   Hacen falta los dos: el capture abre la camara pero bloquea la galeria,
   y a veces el auditor ya tiene la foto en el telefono. */
function fotoBtns(handler,label){
 const l=label?`<span class="lbl">${label}</span>`:'';
 return `${l}<div class="row mt6" style="gap:6px">`
 +`<label class="btn-out" style="flex:1;text-align:center;cursor:pointer;font-size:12px;margin:0;padding:8px 6px">&#x1F4F7; C&aacute;mara`
 +`<input type="file" accept="image/*" capture="environment" onchange="${handler}" class="file-hidden"></label>`
 +`<label class="btn-out" style="flex:1;text-align:center;cursor:pointer;font-size:12px;margin:0;padding:8px 6px">&#x1F5BC; Galer&iacute;a`
 +`<input type="file" accept="image/*" onchange="${handler}" class="file-hidden"></label>`
 +`</div>`;
}
/* Version para los "+ Agregar otra foto" que crean el input por JS. */
function abrirSelectorFoto(modo,cb){
 const inp=document.createElement('input');
 inp.type='file';inp.accept='image/*';
 if(modo==='camara')inp.capture='environment';
 inp.className='file-hidden';
 // Safari en iPhone puede no abrir camara/galeria si el input no esta
 // realmente insertado en la pagina. Se agrega, se usa, y se saca despues.
 document.body.appendChild(inp);
 inp.onchange=(ev)=>{
  const f=ev.target.files[0];
  if(f)cb(f);
  inp.remove();
 };
 inp.click();
}

/* ===== ULTIMO VACIAMIENTO DE PLANTA =====
   Se registra POR GRANO y POR PLANTA, segun lo que informa el personal de la
   cooperativa. Es una declaracion, no una medicion: por eso se guarda tambien
   quien lo informo.

   Para que sirve: si una planta no se vacia, la diferencia de cada campania
   queda escondida dentro del margen de error del cubicaje (8-10%) y se
   acumula ano tras ano. Recien aparece de golpe cuando se vacia, con un
   faltante grande que nadie vio venir. Registrarlo lo vuelve rastreable. */
const VACIADO_OPC=[
 {v:'actual', t:'En esta campa&ntilde;a',      nivel:0},
 {v:'c1',     t:'Hace 1 campa&ntilde;a',       nivel:0},
 {v:'c2',     t:'Hace 2 campa&ntilde;as',      nivel:1},
 {v:'c3',     t:'Hace 3 campa&ntilde;as',      nivel:2},
 {v:'c3mas',  t:'M&aacute;s de 3 campa&ntilde;as', nivel:2},
 {v:'nosabe', t:'No se pudo precisar',         nivel:2},
];
function vaciadoOpc(v){return VACIADO_OPC.find(o=>o.v===v)||null;}
function vaciadoNivel(v){const o=vaciadoOpc(v);return o?o.nivel:-1;}
/* Texto plano de la opcion, para el informe. */
function vaciadoTexto(v){
 const o=vaciadoOpc(v);if(!o)return'';
 return o.t.replace(/&ntilde;/g,'\u00f1').replace(/&aacute;/g,'\u00e1').replace(/&oacute;/g,'\u00f3');
}
/* Granos que se midieron en una planta (para saber cuales hay que preguntar). */
function granosDePlanta(pt){
 if(!pt||!pt.byGrano)return[];
 return Object.keys(pt.byGrano).filter(g=>g!=='VACIO'&&(pt.byGrano[g]||0)>0);
}

 var barra='<div class="barra-app">'

  +'<button class="b-pdf" onclick="window.print()">&#128424; PDF</button>'
  +'<button class="b-com" onclick="compartirInforme()">&#128228; Compartir</button>'
  +'</div>';
 var js='<scr'+'ipt>'
  +'function volverApp(){try{window.close()}catch(e){}'
  +'setTimeout(function(){if(!window.closed){if(history.length>1){history.back()}else{'
  +'document.body.insertAdjacentHTML("afterbegin",\'<div style="background:#fff3e0;'
  +'border-left:4px solid #e0a050;padding:12px;margin-bottom:12px;font-size:13px">'
  +'Cerra esta pestana para volver a Cubicaje.<\\/div>\')}}},250)}'
  +'function compartirInforme(){'
  +'var nom='+JSON.stringify(nom)+';'
  +'var cont="<!DOCT"+"YPE html>"+document.documentElement.outerHTML;'
  +'try{var f=new File([cont],nom,{type:"text/html"});'
  +'if(navigator.canShare&&navigator.canShare({files:[f]})){'
  +'navigator.share({files:[f],title:nom});return}}catch(e){}'
  +'var bl=new Blob([cont],{type:"text/html"});var a=document.createElement("a");'
  +'a.href=URL.createObjectURL(bl);a.download=nom;document.body.appendChild(a);a.click();'

 html=html.replace('</he'+'ad>', css+'</he'+'ad>');

/* Abre un informe en una pestana nueva.
   Antes se usaba document.write, pero Safari no ejecuta los <script> escritos
   asi y los botones de la barra quedaban muertos. Con un Blob URL el navegador
   lo trata como una pagina normal y todo funciona. */
function abrirInforme(html,nombreArchivo){
 html=conBarra(html,nombreArchivo);
 try{
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){setTimeout(()=>URL.revokeObjectURL(url),60000);return true;}
  // sin ventana emergente: se descarga para que lo abran a mano
  const a=document.createElement('a');
  a.href=url;a.download=nombreArchivo||'informe.html';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1000);
  alert('Se descarg\u00f3 el informe. Abrilo desde Archivos o Descargas.');
  return true;
 }catch(e){
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();return true;}
  alert('Permit\u00ed las ventanas emergentes para ver el informe.');
  return false;
 }
}

/* Cartel fijo arriba de todo: fallo de guardado o espacio por agotarse.
   Se muestra en TODAS las pantallas para que no pase desapercibido. */
function bannerEstado(){
 let h='';
 if(__saveFail){
  h+=`<div style="background:var(--danger);color:#fff;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.4">`
   +`&#x26A0; NO SE ESTA GUARDANDO`
   +`<div style="font-weight:400;font-size:12px;margin-top:3px">`
   +(__saveFail==='ESPACIO'?'El almacenamiento esta lleno. Export&aacute; el cubicaje YA y borr&aacute; fotos que no necesites.':'Error al guardar. Export&aacute; el cubicaje para no perder el trabajo.')
   +`</div></div>`;
  return h;
 }
 const st=getStorageInfo();
 if(st.pct>=80){
  h+=`<div style="background:#fff3e0;border-bottom:2px solid #e0a050;padding:8px 14px;font-size:12px;line-height:1.4">`
   +`<b>&#x26A0; Espacio al ${st.pct}%</b> (${st.mb} MB de ~5 MB). `
   +`Cuando se llene dejan de guardarse los datos. Convien&eacute; exportar el cubicaje y borrar fotos que no necesites.`
   +`</div>`;
 }
 return h;
}

function shareOrDownload(blob, filename, title){

  navigator.share({files:[file],title:title||'Cubicaje'}).catch(()=>{fallbackDownload(blob,filename);});

}
function fallbackDownload(blob,filename){

function getStorageInfo(){
 try{let t=0;for(let k in localStorage)if(localStorage.hasOwnProperty(k))t+=localStorage[k].length;

 return{mb,pct,color};}catch(e){return{mb:'?',pct:0,color:'var(--primary)'};}
}

function renderPEOverride(data){
 let h='';
 const ov=data.peOverride||{};
 h+=`<div class="card card-accent"><span class="lbl" style="color:var(--accent)"> Peso Hectol&iacute;trico para este cubicaje</span>`;
 h+=`<div style="font-size:12px;color:var(--textS);margin-bottom:8px">Si el grano tiene calidad diferente a lo est&aacute;ndar, ajust&aacute; el PE ac&aacute;. Solo afecta a este cubicaje. Si lo dej&aacute;s vac&iacute;o, usa el valor por defecto de la configuraci&oacute;n.</div>`;
 getAllGranoKeys(S.config).forEach(g=>{
 const def=getPE(g,{},S.config);
 const rng=PE_RANGOS[g]||[0,1000];
 const v=ov[g]||'';
 h+=`<div class="row mb6"><span style="width:70px;font-size:13px;font-weight:700">${g}</span><input type="text" inputmode="decimal" value="${v}" onchange="setPEOverride('${g}',this.value?numVal(this.value):null)" placeholder="${def}" style="flex:1" min="${rng[0]}" max="${rng[1]}"><span style="font-size:10px;color:var(--textS);width:85px;text-align:right">defecto: ${def}</span></div>`;
 });
 h+=`<button class="btn-out mt8" onclick="clearPEOverride()" style="text-align:center;font-size:12px">Limpiar ajustes (usar valores por defecto)</button>`;
 h+=`</div>`;

 // Show effective PE summary
 h+=`<div class="card card-green"><span class="lbl" style="color:var(--primary)">PH efectivo en este cubicaje</span>`;
 h+=`<table><thead><tr><th>Cereal</th><th>PH (kg/m&#179;)</th><th>Origen</th></tr></thead><tbody>`;
 getAllGranoKeys(S.config).forEach(g=>{
 const ovVal=ov[g];
 const cfVal=S.config.peConfig?.[g];
 const eff=getPE(g,data,S.config);
 const origen=ovVal?'<b style="color:var(--accent)">Ajuste cubicaje</b>':cfVal&&cfVal!==PE_DEFAULTS[g]?'Config personalizado':'Por defecto';
 h+=`<tr><td style="font-weight:600">${g}</td><td>${eff}</td><td style="font-size:11px">${origen}</td></tr>`;
 });
 h+=`</tbody></table></div>`;

 // KGM override for this cubicaje
 const ovk=data.kgmOverride||{};
 h+=`<div class="card" style="background:#f0f4ff;border-color:#7b8fba"><span class="lbl" style="color:#4a5d8a"> Silobolsa: kg/m para este cubicaje</span>`;
 h+=`<div style="font-size:12px;color:var(--textS);margin-bottom:8px">Si los silobolsas est&aacute;n m&aacute;s o menos llenos de lo normal, ajust&aacute; el kg por metro ac&aacute;.</div>`;
 getAllGranoKeys(S.config).forEach(g=>{
 const def=getKGM(g,{},S.config);
 const v=ovk[g]||'';
 h+=`<div class="row mb6"><span style="width:70px;font-size:13px;font-weight:700">${g}</span><input type="text" inputmode="decimal" value="${v}" onchange="setKGMOverride('${g}',this.value?numVal(this.value):null)" placeholder="${def}" style="flex:1"><span style="font-size:10px;color:var(--textS);width:85px;text-align:right">defecto: ${def}</span></div>`;
 });
 h+=`<button class="btn-out mt8" onclick="clearKGMOverride()" style="text-align:center;font-size:12px">Limpiar ajustes</button>`;
 h+=`</div>`;

 return h;
}

function renderPlant(pl,data,totals){
 let h='';
 const cilin=pl.silos.filter(s=>s.tipo==='cilindrico'||!s.tipo);
 // Los elevadores se guardan como 'celda' (comparten el calculo por metros
 // vacios) pero en pantalla van en su propia seccion: no son celdas.
 const celdas=pl.silos.filter(s=>s.tipo==='celda'&&!s.elevador);
 const elevs=pl.silos.filter(s=>s.tipo==='celda'&&s.elevador);
 const otros=pl.silos.filter(s=>s.tipo==='otro');
 const sbExtra=data.silobolsas?.[pl.id]||[];

 // Plant auditor
 const plAud=data.plantAuditores?.[pl.id]||'';
 const plFecha=data.plantFechas?.[pl.id]||'';
 h+=`<div class="card" style="background:var(--accentL);border-color:var(--accent)"><div class="g2"><div><span class="lbl" style="color:var(--accent)"> Fecha</span><input type="date" value="${plFecha}" onchange="setPlantFecha('${pl.id}',this.value)" style="font-size:14px"></div><div><span class="lbl" style="color:var(--accent)"> Auditor</span>`;
 const audListP=S.config.auditoresList||[];
 if(audListP.length){h+=`<select onchange="setPlantAuditor('${pl.id}',this.value)" style="font-size:14px"><option value=""> Seleccionar </option>`;audListP.forEach(a=>{h+=`<option value="${a}"${plAud===a?' selected':''}>${a}</option>`;});h+=`</select>`;}
 else{h+=`<input type="text" value="${plAud}" onchange="setPlantAuditor('${pl.id}',this.value)" placeholder="Nombre" style="font-size:14px">`;}
 h+=`</div></div></div>`;

 // Cil&iacute;ndricos
 if(cilin.length){h+=`<div class="sec-title">Silos cil&iacute;ndricos</div>`;}
 cilin.forEach(silo=>{
 const e=data.entries?.[silo.id]||{};
 const peBase=getPE(e.grano,data,S.config);
 const pe=e.peLocal||peBase;
 const r=calcCil(silo,e,pe);
 const open=S.expanded===silo.id;
 const gc=GRANOS[e.grano]?.color||'#999';
 h+=`<div class="card"><div class="silo-hdr" onclick="toggleSilo('${silo.id}')"><div style="flex:1"><span style="font-weight:700">${silo.nombre}</span>${e.grano&&e.grano!=='VACIO'?`<span class="badge" style="background:${gc}">${e.grano}</span>`:e.grano==='VACIO'?'<span class="badge" style="background:#7b8ea3">VAC&Iacute;O</span>':''}${!silo.diametro||!silo.altChapa?'<span class="badge" style="background:var(--danger)" title="Falta cargar las medidas de este silo en Config">SIN MEDIDAS</span>':''}</div><div style="text-align:right"><div style="font-weight:700;font-size:15px">${fTn(r.kg)} tn</div><div style="font-size:11px;color:var(--textS)">${r.m3.toFixed(1)} m&#179; &#183; PH ${pe}</div></div><span style="color:var(--textS);font-size:16px;margin-left:4px">${open?'':''}</span></div>`;
 if(open){
 h+=`<div class="silo-body"><span class="lbl">Grano</span><select onchange="setEntry('${silo.id}','grano',this.value)">${granoOpts(e.grano,true)}</select>`;
 if(silo.medidaVacios&&silo.alturaTotal>0){
  // ELEVADOR: es un silo comun, pero se mide desde arriba.
  // El auditor carga los metros VACIOS y la app deduce los metros llenos.
  // Los conos se cargan igual que en cualquier silo.
  const altT=silo.alturaTotal;
  const llenos=e.chapasLlenas!=null?(e.chapasLlenas*(silo.altChapa||1)):null;
  const vac=e.metrosVacios!=null?e.metrosVacios:(llenos!=null?+(altT-llenos).toFixed(2):'');
  h+=`<div class="g2 mt8"><div><span class="lbl">Metros vac&iacute;os desde arriba</span><input type="text" inputmode="decimal" step="0.1" min="0" max="${altT}" value="${vac}" onchange="setVacios('${silo.id}',${altT},${silo.altChapa||1},this.value)"><div style="font-size:11px;color:var(--textS);margin-top:2px">altura total ${altT} m</div></div><div><span class="lbl">Direcci&oacute;n del cono</span>${conoHtml(e.cono??0)}</div></div>`;
  if(llenos!=null)h+=`<div style="font-size:11px;color:var(--primary);margin-top:4px">Quedan <b>${llenos.toFixed(2)} m</b> de grano.</div>`;
 }else{
 h+=`<div class="g2 mt8"><div><span class="lbl">${silo.medidaMetros?'Metros llenos':'Chapas llenas'}</span><input type="text" inputmode="decimal" step="0.25" min="0" value="${e.chapasLlenas!=null?e.chapasLlenas:''}" onchange="setEntry('${silo.id}','chapasLlenas',this.value?numVal(this.value):null)"><div style="font-size:11px;color:var(--textS);margin-top:2px">de ${silo.chapasTotales}${silo.medidaMetros?' m':''}</div></div><div><span class="lbl">Direcci&oacute;n del cono</span>${conoHtml(e.cono??0)}</div></div>`;
 }
 if(silo.profCono>0){h+=`<div class="mt8"><span class="lbl">% cono inferior lleno (defecto: 100%)</span><input type="text" inputmode="decimal" min="0" max="100" value="${e.pctCono!=null?e.pctCono:''}" onchange="setEntry('${silo.id}','pctCono',this.value?numVal(this.value):null)" placeholder="100" style="width:120px"></div>`;}
 if(silo.falda>0){h+=`<div class="mt8"><span class="lbl">% falda llena (${silo.falda}m) (defecto: 100%)</span><input type="text" inputmode="decimal" min="0" max="100" value="${e.pctFalda!=null?e.pctFalda:''}" onchange="setEntry('${silo.id}','pctFalda',this.value?numVal(this.value):null)" placeholder="100" style="width:120px"></div>`;}
 h+=`<div class="g2 mt8"><div><span class="lbl">PH particular (dejar vac&iacute;o = ${pe})</span><input type="text" inputmode="decimal" value="${e.peLocal||''}" onchange="setEntry('${silo.id}','peLocal',this.value?numVal(this.value):null)" placeholder="${pe}"></div><div></div></div>`;
 h+=`<div class="mt8"><span class="lbl">Observaciones</span><input type="text" value="${esc(e.obs)}" onchange="setEntry('${silo.id}','obs',this.value)" placeholder="Estado, calidad, notas..."></div>`;
 h+=`<div class="mt6">${fotoBtns(`handlePhoto('${silo.id}',this)`,'Fotos')}`;
 if(e.foto)h+=`<div class="mt6"><img src="${e.foto}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border)"><button class="btn-x" onclick="borrarFotoPpal('silo','${silo.id}')" style="font-size:10px">x</button></div>`;
 const fExtras=e.fotosExtra||[];
 fExtras.forEach((f,fi)=>{h+=`<div class="mt6"><img src="${f}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border)"><button class="btn-x" onclick="removeFotoExtra('${silo.id}',${fi},'silo')" style="font-size:10px">x</button></div>`;});
 if(e.foto)h+=`<div class="row mt6" style="gap:6px"><button class="btn-out" style="flex:1;font-size:11px" onclick="addFotoExtra('${silo.id}','silo','camara')">&#x1F4F7; Otra con c&aacute;mara</button><button class="btn-out" style="flex:1;font-size:11px" onclick="addFotoExtra('${silo.id}','silo','galeria')">&#x1F5BC; De galer&iacute;a</button></div>`;
 h+=`</div>`;
 h+=`<div class="info-box">${silo.diametro}m &#183; Chapa ${silo.altChapa}m &#183; Cono inf ${silo.profCono}m &#183; Cono sup ${silo.altConoSup}m &#183; <b>PH: ${e.peLocal||pe}</b></div></div>`;
 }
 h+=`</div>`;
 });

 // Celdas y elevadores (secciones separadas)
 if(celdas.length)h+=`<div class="sec-title">Celdas</div>`;
 [...celdas,...(elevs.length?[{__sep:1}]:[]),...elevs].forEach(c=>{
 if(c.__sep){h+=`<div class="sec-title">&#x1F3D7; Elevadores <span style="font-weight:400;font-size:11px;color:var(--textS)">(se miden por metros vac&iacute;os desde arriba)</span></div>`;return;}
 const e=data.celdaEntries?.[c.id]||{};
 const peBase=getPE(e.grano,data,S.config);
 const pe=e.peLocal||peBase;
 const peT=getPE('TRIGO',data,S.config);
 const r=calcCelda(c,e,pe,peT);
 const met=e.metodo||'capacidad';
 const hasCap=c.capacidad>0;
 const hasDim=(c.largo>0&&c.ancho>0)||(e.largoLocal>0&&e.anchoLocal>0);
 const open=S.expanded===c.id;
 h+=`<div class="card"><div class="silo-hdr" onclick="toggleSilo('${c.id}')"><div style="flex:1"><span style="font-weight:700">${c.nombre}</span>${e.grano&&e.grano!=='VACIO'?`<span class="badge" style="background:${GRANOS[e.grano]?.color||'#999'}">${e.grano}</span>`:e.grano==='VACIO'?'<span class="badge" style="background:#7b8ea3">VAC&Iacute;O</span>':''}${!c.capacidad&&!c.largo&&!c.elevador?'<span class="badge" style="background:var(--danger)" title="Falta cargar las medidas de esta celda en Config">SIN MEDIDAS</span>':''}</div><div style="text-align:right"><div style="font-weight:700;font-size:15px">${fTn(r.kg)} tn</div></div><span style="color:var(--textS);font-size:16px;margin-left:4px">${open?'':''}</span></div>`;
 if(open){
 h+=`<div class="silo-body">`;
 // Info line
 const infoParts=[];
 if(c.largo&&c.ancho&&c.altura)infoParts.push(c.largo+'\u00d7'+c.ancho+'\u00d7'+c.altura+'m = '+(c.largo*c.ancho*c.altura).toFixed(0)+' m\u00b3'+(c.capacidad?' ('+c.capacidad+' tn trigo)':''));
 else if(hasCap)infoParts.push('Cap: '+c.capacidad+' tn (trigo)');
 if(c.largo)infoParts.push(c.largo+'&#215;'+c.ancho+'&#215;'+c.altura+'m');
 if(c.profConoCelda)infoParts.push('Cono inf: '+c.profConoCelda+'m');
 if(infoParts.length)h+=`<div class="info-box mb6">${infoParts.join(' &#183; ')}</div>`;
 // Grano + PE
 h+=`<div class="g2"><div><span class="lbl">Grano</span><select onchange="setCelda('${c.id}','grano',this.value)">${granoOpts(e.grano,true)}</select></div><div><span class="lbl">PH particular (vac&iacute;o = ${peBase})</span><input type="text" inputmode="decimal" value="${e.peLocal||''}" onchange="setCelda('${c.id}','peLocal',this.value?numVal(this.value):null)" placeholder="${peBase}"></div></div>`;
 // Method pills
 h+=`<div class="mt8 mb6"><span class="lbl">M&eacute;todo de c&aacute;lculo</span><div style="display:flex;gap:4px">`;
 if(hasCap)h+=`<button class="pill ${met==='capacidad'?'pill-on':'pill-off'}" onclick="setCelda('${c.id}','metodo','capacidad')">Por capacidad</button>`;
 h+=`<button class="pill ${met==='medidas'?'pill-on':'pill-off'}" onclick="setCelda('${c.id}','metodo','medidas')">Por medidas</button>`;
 h+=`<button class="pill ${met==='directo'?'pill-on':'pill-off'}" onclick="setCelda('${c.id}','metodo','directo')">Directo</button>`;
 h+=`</div></div>`;
 // Method inputs
 if(met==='capacidad'&&hasCap){
 const peTrigo=getPE('TRIGO',data,S.config);
 const factor=pe/(peTrigo||800);
 const capGrano=c.capacidad*factor;
 const resTn=capGrano*(e.pctLleno||0)/100;

// Firma handlers
let _drawing=false,_lastX=0,_lastY=0;
window.initFirmaCanvas=(canvasId)=>{
 const cv=document.getElementById(canvasId);
 if(!cv||cv._init)return;cv._init=true;
 const ctx=cv.getContext('2d');
 const getPos=(e)=>{
 const r=cv.getBoundingClientRect();
 const t=e.touches?e.touches[0]:e;
 return[(t.clientX-r.left)*(cv.width/r.width),(t.clientY-r.top)*(cv.height/r.height)];
 };
 const start=(e)=>{e.preventDefault();_drawing=true;[_lastX,_lastY]=getPos(e);};
 const move=(e)=>{
 if(!_drawing)return;e.preventDefault();
 const[x,y]=getPos(e);
 ctx.beginPath();ctx.moveTo(_lastX,_lastY);ctx.lineTo(x,y);
 ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
 _lastX=x;_lastY=y;
 };
 const end=()=>{_drawing=false;};
 cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);
 cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
 cv.addEventListener('touchstart',start,{passive:false});
 cv.addEventListener('touchmove',move,{passive:false});
 cv.addEventListener('touchend',end);
};

 const cv=document.getElementById('firma_'+plantaId);
 if(!cv)return;

 saveActive();render();

window.saveFirmaAud=(plantaId)=>{

window.importarDesdeData=async function(pkg,mode){
 try{
 if(mode==='cubicaje'&&pkg.tipo==='cubicaje_completo'){
  if(pkg.config){
   const existing=S.config;
   if(pkg.cooperativa){
    const idx=existing.cooperativas.findIndex(c=>c.id===pkg.cooperativa.id);
    if(idx>=0)existing.cooperativas[idx]=pkg.cooperativa;
    else existing.cooperativas.push(pkg.cooperativa);
   }
   if(pkg.config.peConfig)existing.peConfig=pkg.config.peConfig;
   if(pkg.config.kgmConfig)existing.kgmConfig=pkg.config.kgmConfig;
   await saveCfg();
  }
  const newId=uid();
  const newSess={...pkg.session,id:newId};
  S.sessions=[newSess,...S.sessions];
  await sSet('cb-index',S.sessions);
  await sSet('cb-data:'+newId,pkg.data||{entries:{},celdaEntries:{},silobolsas:{},libros:{},arca:{}});
  alert('Cubicaje importado: '+(pkg.session?.coopName||''));
  render();
 }else if(mode==='merge'){
  if(!S.activeData||!S.activeId)return alert('Primero abr\u00ed el cubicaje donde quer\u00e9s unificar');
  const incoming=pkg.data||{};
  ['entries','celdaEntries','libros','arca','plantAuditores','plantFechas','firmas'].forEach(k=>{
   if(incoming[k])Object.assign(S.activeData[k]=S.activeData[k]||{},incoming[k]);
  });
  if(incoming.silobolsas)Object.keys(incoming.silobolsas).forEach(k=>{
   S.activeData.silobolsas=S.activeData.silobolsas||{};
   S.activeData.silobolsas[k]=(S.activeData.silobolsas[k]||[]).concat(incoming.silobolsas[k]);
  });
  saveActive();alert('Datos unificados correctamente');render();
 }else{alert('Formato no reconocido');}
 }catch(e){alert('Error al importar: '+e.message);}
};
window.importarConfigDesdeData=function(data){
 try{
  if(!data.plantas)return alert('Archivo de config inv\u00e1lido');
  const idx=S.config.cooperativas.findIndex(c=>c.id===data.id);
