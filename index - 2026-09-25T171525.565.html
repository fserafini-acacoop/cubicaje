<script>
/* ===== VERSION =====
   UNICA fuente de verdad. Al tocar el archivo, subir APP_VER y APP_FECHA.
   El encabezado la lee de aca, no hay que cambiarla en dos lados. */
var APP_VER='1.7';
var APP_FECHA='25/09/2026';
(function(){
 var stored=localStorage.getItem('cubicaje_app_version');
 if(stored&&stored!==APP_VER){
  localStorage.setItem('cubicaje_app_version',APP_VER);
  window.__appActualizada=stored; // version anterior, para avisar en pantalla
  console.log('App actualizada de v'+stored+' a v'+APP_VER);
 }else if(!stored){
  localStorage.setItem('cubicaje_app_version',APP_VER);
 }
})();
</script>
<style>
:root{--bg:#f5f3ee;--surface:#fff;--primary:#2d5016;--primaryL:#e8f0e4;--accent:#c8982a;--accentL:#fefbf0;--text:#1a1a1a;--textS:#666;--border:#e0ddd6;--danger:#c62828;--dangerBg:#fce8e8;--success:#2e7d32;--successBg:#e8f5e9;--r:10px;--sh:0 1px 4px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body,html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:var(--text);background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px}
.hdr{background:var(--primary);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:16px;font-weight:700;flex:1;margin:0}
.hdr-sub{font-size:11px;opacity:.8}
.hbtn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin:8px 12px;padding:12px;box-shadow:var(--sh)}
.card-accent{background:var(--accentL);border-color:var(--accent)}
.card-green{background:var(--primaryL);border-color:var(--primary)}
.card-dark{background:var(--primary);color:#fff;border:none}
.lbl{font-size:11px;font-weight:700;color:var(--textS);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;display:block}
input[type=text],input[type=number],select{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);font-size:15px;background:#fafaf8;-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
select{padding-right:24px}
.btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;width:100%;text-align:center;display:block}
.btn-sm{padding:7px 12px;font-size:13px;width:auto;display:inline-block}
.btn-out{background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;width:100%;text-align:left}
/* display:none en un input dentro de un <label> falla en algunos navegadores
   de celular (no abre camara/galeria al tocar). Se oculta asi en vez de eso. */
.file-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.btn-x{background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tabs{display:flex;overflow-x:auto;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 6px}
.tabs button{padding:9px 12px;font-size:12px;font-weight:500;color:var(--textS);border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;background:none}
.tabs button.act{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.cono-bar{display:flex;gap:3px}
.cono-btn{flex:1;padding:7px 2px;border-radius:7px;font-size:16px;border:1px solid var(--border);background:#fff;cursor:pointer;text-align:center;line-height:1}
.cono-btn.act{border:2px solid var(--primary);background:var(--primaryL)}

function getAllGranos(config){
 const all={...GRANOS};
 if(config?.customGranos){Object.entries(config.customGranos).forEach(([k,v])=>{all[k]={color:v.color||'#888',pe:v.pe||0};});}
 return all;
}
function getAllGranoKeys(config){return Object.keys(getAllGranos(config));}

function getPE(grano,activeData,config){
 if(!grano||grano==='VACIO')return 0;
 const ov=activeData?.peOverride?.[grano];
 if(ov!=null&&ov>0)return ov;
 const cf=config?.peConfig?.[grano];
 if(cf!=null&&cf>0)return cf;
 if(PE_DEFAULTS[grano])return PE_DEFAULTS[grano];
 // Granos agregados a mano: su PH vive en customGranos. Sin esto el silo daba 0 kg
 // en silencio, que es la peor forma de fallar en un cubicaje.
 const cg=config?.customGranos?.[grano];
 if(cg&&cg.pe>0)return cg.pe;
 return 0;
}

function getKGM(grano,activeData,config){
 if(!grano||grano==='VACIO')return 0;
 const ov=activeData?.kgmOverride?.[grano];
 if(ov!=null&&ov>0)return ov;
 const cf=config?.kgmConfig?.[grano];
 if(cf!=null&&cf>0)return cf;
 if(KGM_DEFAULTS[grano])return KGM_DEFAULTS[grano];
 // Igual que en getPE: para un grano agregado a mano, los kg por metro de silobolsa
 // salen de su PH por la seccion estandar.
 const cg=config?.customGranos?.[grano];
 if(cg&&cg.pe>0)return Math.round(SECCION_SB*cg.pe);
 return 0;
}


function mergeCoopCatalog(config){
 if(!config.cooperativas)config.cooperativas=[];
 CATALOGO_COOPS.forEach(cat=>{
 const cid=cat.clave.toLowerCase().replace(/[^a-z0-9]/g,'_');
 const existing=config.cooperativas.find(c=>c.id===cid||c.clave===cat.clave);
 if(!existing){
 config.cooperativas.push({id:cid,clave:cat.clave,nombre:cat.nombre,plantas:[]});
 }else{
 existing.clave=cat.clave;existing.nombre=cat.nombre;
 }
 });
 config.cooperativas.sort((a,b)=>(a.clave||a.nombre).localeCompare(b.clave||b.nombre));
 return config;
}

/* Fecha en formato argentino dd/mm/aaaa.
   Los inputs type=date guardan siempre aaaa-mm-dd; eso queda igual internamente
   (es lo que ordena bien), pero al MOSTRAR se usa siempre esta funcion.
   Si el valor no tiene el formato esperado se devuelve tal cual, sin romper. */
function fFecha(v){
 if(!v)return '';
 const s=String(v).trim();
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(m)return m[3]+'/'+m[2]+'/'+m[1];
 return s;
}

}

/* ===== CALCULATIONS ===== */
function calcCil(silo,e,pe){
 if(!e||!e.grano||e.grano==='VACIO')return{m3:0,kg:0};
 // Tonelaje declarado. Cuando el silo no se puede medir (no hay acceso, no hay
 // escalera, esta precintado) el auditor toma el dato de la planta y lo carga
 // aca. Pisa el calculo geometrico, igual que ya hacian las celdas.
 // El m3 queda en 0 a proposito: no se midio volumen, se tomo un declarado.
 if(e.tnDirecto)return{m3:0,kg:e.tnDirecto*1000,directo:true};
 // Sin diametro o sin altura de chapa no se puede cubicar. Antes daba NaN, y ese NaN
 // contagiaba el acumulador de la planta: el silo siguiente arrancaba de cero y se
 // perdia todo lo sumado hasta ahi, sin ningun aviso. Ahora devuelve 0 y lo declara.
 if(!(silo.diametro>0)||!(silo.altChapa>0))return{m3:0,kg:0,sinMedidas:true};
 const r=silo.diametro/2,a=Math.PI*r*r;
 // Algunos silos tienen la tolva de abajo mas angosta que el cilindro.
 // Si el silo declara diametroCono, el cono inferior usa ese diametro.
 const rc=(silo.diametroCono||silo.diametro)/2, ac=Math.PI*rc*rc;
 // Que porcentaje del fondo esta ocupado.
 //  - Si el auditor lo cargo a mano, manda lo que cargo.
 //  - Si no, y el silo se mide por vacios contra la altura TOTAL
 //    (vaciosIncluyeCono), lo deduce la propia medicion: cuando el grano no
 //    llega a tapar el fondo, el fondo esta parcialmente lleno.
 //  - Si no, 100%, que es el caso de siempre.
 let pctCono;
 if(e.pctCono!=null) pctCono=e.pctCono/100;
 else if(e.pctConoAuto!=null) pctCono=e.pctConoAuto;
 else pctCono=1;
 // Forma del fondo. Cono en punta -> divisor 3 (default, el caso normal).
 // Fondo en rampa de una sola pendiente -> divisor 2: el volumen es el area
 // por la altura promedio, no un cono. Lo usan los silos de hormigon.
 const cdv=(silo.conoDiv===2)?2:3;
 const vc=(1/cdv)*ac*(silo.profCono||0)*pctCono;
 const pctFalda=(e.pctFalda!=null?e.pctFalda:100)/100;
 const vfalda=a*(silo.falda||0)*pctFalda;
 const vcil=(e.chapasLlenas||0)*silo.altChapa*a;
 const vs=(e.cono||0)*(1/3)*a*(silo.altConoSup||0);
 const bruto=vc+vfalda+vcil+vs;
 const m3=Math.max(0,bruto);
 // Factor de compactacion. El grano se asienta por su propio peso en los silos
 // altos, y algunas cooperativas lo contemplan con un coeficiente sobre el PH.
 // Solo se aplica donde el silo lo declara: sin el campo, nada cambia.
 const kc=silo.compact||1;
 // Partes del calculo, para poder mostrarle al auditor de donde sale el numero.
 // Se arman aca y no en la pantalla para que no se puedan despegar de la formula.
 const partes=[], cm=x=>String(+(+x).toFixed(4)).replace('.',',');
 if(silo.profCono>0)partes.push({q:'Fondo (cono de '+cm(silo.profCono)+' m'+(cdv===2?', dividido por 2':'')+(pctCono<1?', al '+Math.round(pctCono*100)+'%':'')+')',v:vc});
 if(silo.falda>0)partes.push({q:'Falda ('+cm(silo.falda)+' m'+(pctFalda<1?', al '+Math.round(pctFalda*100)+'%':'')+')',v:vfalda});
 if(vcil)partes.push({q:'Cilindro ('+cm(e.chapasLlenas||0)+(silo.medidaMetros?' m':' chapas de '+cm(silo.altChapa)+' m')+')',v:vcil});
 if(vs)partes.push({q:silo.baseCemento
   ? 'Base de cemento ('+cm(silo.altConoSup)+' m'+((e.cono||0)===1?', llena':', al '+Math.round((e.cono||0)*100)+'%')+')'
   : 'Copete (cono superior de '+cm(silo.altConoSup)+' m'+(Math.abs(e.cono||0)!==1?' x '+cm(e.cono):'')+')',v:vs});
 return{m3,kg:m3*(pe||0)*kc,compact:kc!==1?kc:undefined,
        partes,area:a,recortado:bruto<0?bruto:null};
}
function calcSB(e,kgm){
 if(!e||!e.grano||!e.metros)return{kg:0};
 return{kg:e.metros*(kgm||0)};
}

}

 if(hayComp){

 h+='</details>';
 return h;
}

function calcCelda(c,e,pe,peTrigo){
 if(!e||!e.grano||e.grano==='VACIO')return{kg:0,capTn:c.capacidad||0};
 const capTn=c.capacidad||0;
 if(e.tnDirecto)return{kg:e.tnDirecto*1000,capTn,directo:true};
 const met=e.metodo||'capacidad';
 if(met==='capacidad'&&capTn){
 const factor=(pe||0)/(peTrigo||800);
 const capGrano=capTn*factor;
 const cm=x=>String(+(+x).toFixed(4)).replace('.',',');
 const porCap=[{q:'Capacidad declarada (base trigo)',t:capTn},
               {q:'Convertida a '+e.grano+' (PH '+cm(pe||0)+' / '+cm(peTrigo||800)+')',t:capGrano},
               {q:'Al '+cm(e.pctLleno||0)+'% ocupado',t:capGrano*((e.pctLleno||0)/100)}];
 return{kg:capGrano*((e.pctLleno||0)/100)*1000,capTn,capGranoTn:capGrano,porCap};
 }
 if(met==='medidas'){
 const L=e.largoLocal||c.largo||0,W=e.anchoLocal||c.ancho||0;
 const altG=e.altGrano||0;
 const profC=c.profConoCelda||0;
 const altLomo=e.altLomo||0;
 const altDep=e.altDepresion||0;
 const vRect=L*W*altG;
 const vCono=(altG>0||profC>0)?(1/3)*L*W*profC:0;
 // Divisor del copete segun la forma que hace el grano en esa celda:
 //   /2 -> caballete (cresta de punta a punta, celdas alargadas)
 //   /3 -> piramide  (un solo pico al centro, celdas cuadradas)
 // Se respeta lo que usa la planilla de cada cooperativa. Por defecto /3.
 const dv=(c.lomoDiv===2)?2:3;
 // El copete puede no ocupar todo el largo de la celda: si la celda declara
 // un largoLomo propio se usa ese, si no el largo completo.
 const Ll=c.largoLomo||L;
 const vLomo=altLomo>0?(1/dv)*Ll*W*altLomo:0;
 const vDep=altDep>0?(1/dv)*Ll*W*altDep:0;
 const volLomoExtra=c.volLomo?(c.volLomo*((e.pctLomo!=null?e.pctLomo:0)/100)):0;
 // La fosa esta debajo del piso: se llena antes que el cuerpo de la celda.
 const volFosaExtra=c.volFosa?(c.volFosa*((e.pctFosa!=null?e.pctFosa:100)/100)):0;
 const m3=vRect+vCono+vLomo-vDep+volLomoExtra+volFosaExtra;
 // Partes del calculo, para mostrarle al auditor de donde sale el numero.
 const cm=x=>String(+(+x).toFixed(4)).replace('.',',');
 const partes=[];
 if(vRect)partes.push({q:'Cuerpo ('+cm(L)+' x '+cm(W)+' x '+cm(altG)+' m de grano)',v:vRect});
 if(vCono)partes.push({q:'Fondo (cono de '+cm(profC)+' m, dividido por 3)',v:vCono});
 if(vLomo)partes.push({q:'Copete ('+cm(altLomo)+' m, dividido por '+dv+(c.largoLomo?', sobre '+cm(Ll)+' m de largo':'')+')',v:vLomo});
 if(vDep)partes.push({q:'Depresion ('+cm(altDep)+' m, dividido por '+dv+')',v:-vDep});
 if(volLomoExtra)partes.push({q:'Copete declarado ('+cm(e.pctLomo||0)+'% de '+cm(c.volLomo)+' m3)',v:volLomoExtra});
 if(volFosaExtra)partes.push({q:'Fosa bajo el piso ('+cm(e.pctFosa!=null?e.pctFosa:100)+'% de '+cm(c.volFosa)+' m3)',v:volFosaExtra});
 return{kg:m3*(pe||0),capTn,m3,partes};
 }
 return{kg:0,capTn};
}
/* Una sola fuente para la celda.
   El calculo de celdas estaba escrito en cuatro lugares (pantalla, constancia de
   planta, informe general y Excel) y las copias se fueron separando: el informe y
   el Excel ignoraban el PH propio de la celda, y la constancia usaba 800 fijo como
   base trigo en vez del PH de trigo configurado. Resultado: el informe no cerraba
   con sus propias filas. Ahora todos preguntan aca, asi no pueden decir cosas
   distintas. 24/09. */
function filaCelda(c,e,data,config){
 e=e||{};
 const peBase=getPE(e.grano,data,config)||0;   // PH general del grano
 const pe=e.peLocal||peBase;                   // el medido en el lugar, si lo hay
 const peT=getPE('TRIGO',data,config)||800;    // base trigo de la capacidad declarada
 const r=calcCelda(c,e,pe,peT);
 const met=e.metodo||'capacidad';
 const metDesc = met==='directo' ? 'Directo'
   : met==='medidas' ? 'Por medidas'
   : 'Cap. '+(c.capacidad||0)+'tn'+(e.pctLleno!=null?' al '+e.pctLleno+'%':'');
 return{pe,peBase,peT,peLocal:!!e.peLocal,r,met,metDesc,kg:r.kg,tn:r.kg/1000};
}
function calcOtro(e){return{kg:((e&&e.tnDirecto)||0)*1000};}

/* ===== NUMEROS: acepta coma o punto como decimal ===== */
// Algunos celulares muestran coma en el teclado numerico. Esta funcion
// acepta ambos sin romper nada: si escriben con punto sigue funcionando igual.
// Suma de partidas: el auditor escribe "1200+340+56" cuando el listado del sistema
// trae varias cosechas del mismo grano y hay que sumarlas. Devuelve el total y el
// detalle, para poder mostrar de que partidas salio.
// La coma sigue siendo decimal (el teclado del iPhone da coma), y el punto tambien.
// Sin esto, numVal borraba el "+" y "1200+340" se guardaba como 1200340, en silencio.
function sumaVal(v){
 if(v==null||String(v).trim()==='')return{total:null,partes:[],esSuma:false};
 const txt=String(v).replace(/\s/g,'');
 const esSuma=/[+]/.test(txt)||/(?!^)-/.test(txt);
 const tokens=txt.replace(/(?!^)-/g,'+-').split('+');
 const partes=[];let total=0,algo=false;
 for(const t of tokens){
  if(t==='')continue;
  const n=numVal(t);
  if(n==null)return{total:null,partes:[],esSuma,invalido:true};
  partes.push(n);total+=n;algo=true;
 }
 if(!algo)return{total:null,partes:[],esSuma:false};
 return{total:+total.toFixed(6),partes,esSuma:esSuma&&partes.length>1};
}

function numVal(v){
 if(v==null||v==='')return null;
 // Los campos numericos son type="text" porque el teclado del iPhone da COMA
 // y no punto; un input type="number" descartaria la coma. Aca se acepta
 // cualquiera de las dos y se limpia lo que no sea numero.
 let t=String(v).trim().replace(/\s/g,'');
 // Si hay coma, la coma es el decimal y los puntos son separadores de miles:
 // "1.200,5" es mil doscientos con cinco, no 1,2. Sin coma, el punto sigue siendo
 // decimal como hasta ahora ("1200.5"), asi no cambia nada de lo que ya andaba.
 if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
 t=t.replace(/[^0-9.\-]/g,'');
 if(t===''||t==='-'||t==='.')return null;
 const n=Number(t);
 return isNaN(n)?null:n;
}

/* ===== ESCAPE HTML ===== */
// Convierte caracteres especiales para que un texto con comillas o < > no rompa la pantalla
function decEnt(s){
 if(s==null)return '';
 const M={'&aacute;':'\u00e1','&eacute;':'\u00e9','&iacute;':'\u00ed','&oacute;':'\u00f3',
  '&uacute;':'\u00fa','&ntilde;':'\u00f1','&uuml;':'\u00fc','&Aacute;':'\u00c1','&Eacute;':'\u00c9',
  '&Iacute;':'\u00cd','&Oacute;':'\u00d3','&Uacute;':'\u00da','&Ntilde;':'\u00d1'};
 return String(s).replace(/&[A-Za-z]+;/g,m=>M[m]!==undefined?M[m]:m);
}
function escN(s){return esc(decEnt(s));}

function esc(s){
 if(s==null)return '';
 return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ===== COMPRESION DE FOTOS ===== */
// Reduce el tamano de las fotos antes de guardar (max 1280px, calidad 70%)
// Una foto de ~5MB queda en ~150KB. Evita saturar el almacenamiento.
function comprimirFoto(file,cb){
 const reader=new FileReader();
 reader.onload=(e)=>{
  const img=new Image();
  img.onload=()=>{
   const MAX=1280;
   let w=img.width,h=img.height;
   if(w>MAX||h>MAX){
    if(w>h){h=Math.round(h*MAX/w);w=MAX;}
    else{w=Math.round(w*MAX/h);h=MAX;}
   }
   const canvas=document.createElement('canvas');
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
   ctx.drawImage(img,0,0,w,h);
   try{cb(canvas.toDataURL('image/jpeg',0.7));}
   catch(err){cb(e.target.result);} // si falla, usa la original
  };
  img.onerror=()=>cb(e.target.result);
  img.src=e.target.result;
 };
 reader.onerror=()=>alert('No se pudo leer la foto.');
 reader.readAsDataURL(file);
}

const hasClaudeStorage=typeof window.storage!=='undefined'&&window.storage?.get;
/* Estado del ultimo guardado. Si falla hay que AVISAR: el auditor puede

let __saveFail=null;      // null | 'ESPACIO' | 'ERROR'
let __saveAvisado=false;  // para no repetir el alert en cada tecla
/* Si el almacenamiento de Claude falla (cae el servidor, se corta la red),
   NO se pierde el trabajo: se guarda en el localStorage del navegador y se
   sigue laburando. El auditor esta en el campo, no puede quedarse sin app. */
let __degradado=false;    // true = guardando en el navegador, no en Claude
let __degradadoAvisado=false;
function lsSet(k,v){localStorage.setItem('cb_'+k,JSON.stringify(v));}
function lsGet(k,fb){const v=localStorage.getItem('cb_'+k);return v?JSON.parse(v):fb;}

/* "La clave no existe" NO es una falla: es lo normal la primera vez que se
   abre la app, o cuando todavia no se guardo nada con esa clave. Solo se
   avisa cuando el almacenamiento realmente se cayo. */
function esClaveInexistente(e){
 const t=String((e&&e.name||'')+' '+(e&&e.message||''));
 return /key not found|not found|no such key|does not exist|404/i.test(t);
}

async function sGet(k,fb){
 if(hasClaudeStorage&&!__degradado){
  try{
   const r=await window.storage.get(k);
   if(r)return JSON.parse(r.value);
  }catch(e){
   if(!esClaveInexistente(e))console.warn('Lectura de Claude storage fallo, voy al navegador:',e);
  }
 }
 try{return lsGet(k,fb);}catch{return fb}
}

async function sSet(k,v){
 // 1) intento el almacenamiento de Claude
 if(hasClaudeStorage&&!__degradado){
  try{
   await window.storage.set(k,JSON.stringify(v));
   __saveFail=null;
   return true;
  }catch(e){
   console.warn('Claude storage fallo, paso a guardar en el navegador:',e);
   __degradado=true;   // no reintento en cada tecla: quedaria la app trabada
  }
 }
 // 2) el navegador, que es lo que se usa en GitHub Pages
 try{
  lsSet(k,v);
  __saveFail=null;
  if(__degradado)avisarDegradado();
  return true;
 }catch(e){
  console.error('Fallo al guardar:',e);
  const txt=String(e&&(e.name||'')+' '+(e&&e.message||''));
  __saveFail=/quota|exceeded|full|NS_ERROR_DOM_QUOTA/i.test(txt)?'ESPACIO':'ERROR';
  return false;
 }
}

/* ===== CONTROL DE CARGA DE UNA COOPERATIVA =====
   Se corre sobre la configuracion, sin necesidad de tener un cubicaje cargado.
   Busca los errores que aparecen al pasar una planilla a la app: medidas que
   faltan, geometrias que no pueden ser, nombres repetidos, capacidades de celda
   que no cierran con sus propias medidas. Es lo que se venia revisando a mano
   cooperativa por cooperativa. 24/09. */

// Angulo de reposo del grano: apilado libre, un cereal no pasa de unos 32 grados.
// Si para que la capacidad declarada entre hace falta una pila mas empinada que
// eso, el numero no puede salir de esas medidas.
const ANG_MAX_PILA=32;

function controlCarga(coop,config){
 const av=[];
 const add=(nivel,planta,estructura,que,detalle)=>av.push({nivel,planta,estructura,que,detalle});
 const n=x=>Number(x)||0;
 const fm=x=>Number(x).toLocaleString('es-AR',{maximumFractionDigits:2});
 const plantas=coop?.plantas||[];
 const idsVistos={};

 plantas.forEach(p=>{
  const nombres={};
  (p.silos||[]).forEach(s=>{
   const tipo=s.tipo||'cilindrico';
   // --- ids y nombres repetidos
   if(idsVistos[s.id])add('alto',p.nombre,s.nombre,'ID repetido',
     'Comparte el id "'+s.id+'" con '+idsVistos[s.id]+'. Lo que se cargue en una se pisa con la otra.');
   else idsVistos[s.id]=p.nombre+' / '+s.nombre;
   const clave=String(s.nombre||'').trim().toUpperCase();
   if(nombres[clave])add('medio',p.nombre,s.nombre,'Nombre repetido en la planta',
     'Hay otra estructura con el mismo nombre. El auditor no va a saber cual carga.');
   else nombres[clave]=1;

   if(tipo==='cilindrico'){
    // --- medidas que faltan
    const faltan=[];
    if(!(n(s.diametro)>0))faltan.push('diametro');
    if(!(n(s.altChapa)>0))faltan.push('altura de chapa');
    if(faltan.length)add('alto',p.nombre,s.nombre,'No se puede cubicar',
      'Falta: '+faltan.join(' y ')+'. No suma al total de la planta.');
    else{
     // --- geometrias que no pueden ser
     if(n(s.altChapa)>3)add('alto',p.nombre,s.nombre,'Altura de chapa imposible',
       fm(s.altChapa)+' m. Una chapa de silo no pasa de unos 3 m: suele ser un volumen metido en el campo equivocado.');
     if(n(s.diametro)>35)add('alto',p.nombre,s.nombre,'Diametro imposible',fm(s.diametro)+' m.');
     if(n(s.profCono)>n(s.diametro)*1.5)add('medio',p.nombre,s.nombre,'Cono de fondo desproporcionado',
       'Fondo de '+fm(s.profCono)+' m para un diametro de '+fm(s.diametro)+' m.');
     if(!s.baseCemento&&n(s.altConoSup)>n(s.diametro))add('medio',p.nombre,s.nombre,'Cono superior desproporcionado',
       'Copete de '+fm(s.altConoSup)+' m para un diametro de '+fm(s.diametro)+' m.');
     if(!(n(s.chapasTotales)>0))add('bajo',p.nombre,s.nombre,'Sin cantidad total de chapas',
       'El auditor no ve el tope al cargar en el campo, y el informe no puede mostrar "llenas / totales".');
    }
   }else if(tipo==='celda'){
    const cap=n(s.capacidad),L=n(s.largo),W=n(s.ancho),H=n(s.altura);
    if(!cap&&!(L&&W&&H)&&!s.elevador)
     add('medio',p.nombre,s.nombre,'Celda sin medidas: solo carga directa',
       'No tiene capacidad ni largo/ancho/alto, asi que no se puede cubicar: el auditor va a '
       +'tener que cargar las toneladas a mano. Si es una secadora, un pulmon o un galpon esta '
       +'bien asi. Si es una celda de verdad, faltan las medidas.');
    if(cap&&L&&W&&H){
     // La capacidad declarada esta en base trigo (PH 800): pasarla a m3.
     const m3Cap=cap*1000/800;
     const m3Prisma=L*W*H;
     const div=(s.lomoDiv===2)?2:3;
     const Ll=n(s.largoLomo)||L;
     const sobra=m3Cap-m3Prisma-(n(s.volLomo)||0);
     if(sobra>0.5){
      // Lo que sobra tendria que ser el copete. ¿Que altura de pila haria falta?
      const hPila=sobra*div/(Ll*W);
      const ang=Math.atan(hPila/(W/2))*180/Math.PI;
      if(ang>ANG_MAX_PILA+6)
       add('alto',p.nombre,s.nombre,'La capacidad no cierra con las medidas',
         'Declara '+fm(cap)+' tn ('+fm(m3Cap)+' m3), pero el cuerpo da '+fm(m3Prisma)+' m3. '
         +'Para llegar haria falta un copete de '+fm(hPila)+' m, o sea una pila de '+fm(ang)
         +' grados: el grano no se apila tan empinado. Revisar la capacidad o las medidas.');
      else if(ang>ANG_MAX_PILA)
       add('medio',p.nombre,s.nombre,'La capacidad queda al limite',
         'Declara '+fm(cap)+' tn y el cuerpo da '+fm(m3Prisma)+' m3. La diferencia pide un copete de '
         +fm(hPila)+' m ('+fm(ang)+' grados), apenas por encima de lo que se apila un cereal ('+ANG_MAX_PILA
         +' grados). Puede ser real si la celda tiene paredes mas altas de lo anotado: conviene confirmarlo.');
      else
       add('ok',p.nombre,s.nombre,'La capacidad incluye el copete',
         'Declara '+fm(cap)+' tn y el cuerpo da '+fm(m3Prisma)+' m3: la diferencia se explica '
         +'con un copete de '+fm(hPila)+' m ('+fm(ang)+' grados). Coherente.');
     }else if(sobra<-0.5&&m3Cap>0){
      add('medio',p.nombre,s.nombre,'La capacidad queda corta',
        'Las medidas dan '+fm(m3Prisma+(n(s.volLomo)||0))+' m3 y la capacidad declarada equivale a '
        +fm(m3Cap)+' m3. Si se cubica por medidas va a dar mas que lo declarado.');
     }
    }
    if(cap&&!L&&!W)add('bajo',p.nombre,s.nombre,'Celda solo por capacidad',
      'Tiene capacidad declarada pero no largo, ancho ni altura: no se va a poder cubicar por medidas.');
   }
  });
  // --- el silo que se aparta de sus hermanos
  // Dentro de un grupo de silos identicos (mismo diametro, misma chapa, misma cantidad
  // de chapas) ninguno deberia tener un cono distinto. Cuando uno solo se aparta, casi
  // siempre es un dato mal cargado: en Darregueira eran 17 silos con el cono superior
  // en cero, y en Martini un cono de fondo de 0,40 donde sus cinco hermanos tenian 1,60.
  // Se avisa para revisar, no como error: puede ser que el silo sea distinto de verdad.
  const grupos={};
  (p.silos||[]).forEach(s=>{
   if((s.tipo||'cilindrico')!=='cilindrico')return;
   if(!(n(s.diametro)>0)||s.medidaVacios)return;
   const k=[s.diametro,s.altChapa,s.chapasTotales].join('|');
   (grupos[k]=grupos[k]||[]).push(s);
  });
  Object.values(grupos).forEach(gr=>{
   if(gr.length<3)return;                 // con menos de tres no hay mayoria que valga
   [['profCono','cono de fondo'],['altConoSup','cono superior']].forEach(([campo,rotulo])=>{
    const cuenta={};
    gr.forEach(x=>{const v=n(x[campo]).toFixed(2);cuenta[v]=(cuenta[v]||0)+1;});
    const orden=Object.entries(cuenta).sort((a,b)=>b[1]-a[1]);
    if(orden.length<2)return;
    const mayor=Number(orden[0][0]), cuantos=orden[0][1];
    if(cuantos*2<=gr.length)return;       // sin una mayoria clara no se opina
    gr.forEach(x=>{
     const v=n(x[campo]);
     if(Math.abs(v-mayor)<=0.02)return;   // hasta 2 cm es redondeo, no un error
     add('medio',p.nombre,x.nombre,'Se aparta de los silos iguales a el',
       'Tiene '+rotulo+' de '+fm(v)+' m y los otros '+cuantos+' silos de la misma medida '
       +'tienen '+fm(mayor)+' m. Si es asi de verdad, dejalo; si no, es un dato mal cargado.');
    });
   });
  });
  if(!(p.silos||[]).length)add('medio',p.nombre,'','Planta sin estructuras','No tiene ninguna estructura cargada.');
  if(!p.grupoArca)add('bajo',p.nombre,'','Sin grupo de ARCA',
    'No tiene anotado bajo que C14 de ARCA va esta planta. Sirve para agrupar al comparar con los libros.');
 });

 // --- granos referenciados sin PH
 const granos=getAllGranos(config)||{};
 Object.keys(granos).forEach(g=>{
  if(!getPE(g,null,config))add('medio','','','Grano sin PH','"'+g+'" no tiene peso hectolitrico: todo lo que se cargue con ese grano cubica en cero.');
 });

 const cuenta={alto:0,medio:0,bajo:0,ok:0};
 av.forEach(a=>cuenta[a.nivel]++);
 return{avisos:av,cuenta,estructuras:plantas.reduce((a,p)=>a+(p.silos||[]).length,0),plantas:plantas.length};
}

/* ===== MUDANZA DE DATOS DE CUBICAJES YA CARGADOS =====
   Cuando reorganizamos plantas o sacamos una estructura, el auditor que ya tenia
   trabajo cargado lo perdia sin enterarse: los datos del cubicaje se guardan por id
   de estructura y por id de planta, y si ese id deja de existir en la configuracion
   nadie lo vuelve a mirar. Los kilos no daban mal: desaparecian.
   Aca se anota cada cambio que hicimos, para mudar el dato al lugar nuevo.
   Regla: solo se muda a un lugar VACIO. Si el destino ya tiene dato cargado no se
   pisa nada y se avisa, porque cual de los dos vale lo decide el auditor. 25/09. */
var MIGRACIONES={
 // estructuras que se sacaron -> la estructura que ocupa su lugar
 estructuras:{
  // UNION POSSE: estaban cargadas dos veces, como silo y como celda. Quedo la celda.
  'up_islaverde_nuevaaisacelda':'up_islaverde_celda_nuevaaisacelda',
  'up_jposse_expossensecapilla':'up_jposse_celda_expossensecapilla',
  'up_jposse_gaidogai':'up_jposse_celda_gaidogai',
  'up_jposse_idemnorte':'up_jposse_celda_idemnorte',
  'up_jposse_metalcordcalle':'up_jposse_celda_metalcordcalle'
 },
 // plantas que se unificaron -> la planta que las absorbio
 plantas:{
  'iri_capi':'iri_camil',     // IRIGOYEN: CAPI paso a la solapa de CAMIL (mismo C14)
  'lp_planta3':'lp_centro',   // LA PAZ: Planta 3 y Galpon Celdas pasaron a Planta Centro
  'lp_planta2':'lp_parque',   // LA PAZ: Planta 2 paso a Parque Industrial
  'mart_p2':'mart_p1',        // MARTINI: las 3 plantas son una sola para ARCA
  'mart_p3':'mart_p1'
 }
};

function migrarDatos(data,coop){
 const res={movidos:[],conflictos:[],huerfanos:[]};
 if(!data||!coop)return res;
 const silos={},plantas={};
 (coop.plantas||[]).forEach(p=>{plantas[p.id]=p.nombre;(p.silos||[]).forEach(s=>{silos[s.id]=s;});});
 const tn=kg=>(kg/1000).toLocaleString('es-AR',{maximumFractionDigits:2})+' tn';
 const conGrano=e=>!!(e&&e.grano&&e.grano!=='VACIO');

 // --- 1. estructuras
 ['entries','celdaEntries'].forEach(campo=>{
  const d=data[campo]; if(!d)return;
  Object.keys(d).forEach(id=>{
   if(silos[id])return;                       // sigue existiendo, nada que hacer
   const e=d[id]; if(!conGrano(e))return;     // sin grano cargado, no hay nada que perder
   const destino=MIGRACIONES.estructuras[id];
   const dest=destino&&silos[destino];
   if(!dest){res.huerfanos.push({que:'estructura',id,grano:e.grano,detalle:e.tnDirecto?tn(e.tnDirecto*1000):'dato cargado'});return;}
   const campoDest=(dest.tipo==='celda')?'celdaEntries':'entries';
   if(!data[campoDest])data[campoDest]={};
   if(conGrano(data[campoDest][dest.id])){
    res.conflictos.push({que:'estructura',nombre:dest.nombre,grano:e.grano,
     detalle:'ya hay '+data[campoDest][dest.id].grano+' cargado en "'+dest.nombre+'". No se toco nada.'});
    return;
   }
   data[campoDest][dest.id]=e; delete d[id];
   res.movidos.push({que:'estructura',nombre:dest.nombre,grano:e.grano,
    detalle:e.tnDirecto?tn(e.tnDirecto*1000)+' (carga directa)':'medicion cargada'});
  });
 });

 // --- 2. datos que cuelgan de la planta
 const porPlanta=[['libros','Libros'],['arca','ARCA'],['plantFechas','fecha de la planta'],
                  ['plantAuditores','auditor de la planta'],['vaciados','ultimo vaciamiento']];
 porPlanta.forEach(([campo,rotulo])=>{
  const d=data[campo]; if(!d)return;
  Object.keys(d).forEach(pid=>{
   if(plantas[pid])return;
   const v=d[pid];
   const vacio=v==null||v===''||(typeof v==='object'&&!Object.values(v).some(x=>x!=null&&x!==''));
   if(vacio){delete d[pid];return;}
   const destino=MIGRACIONES.plantas[pid];
   if(!destino||!plantas[destino]){res.huerfanos.push({que:rotulo,id:pid,detalle:'la planta ya no existe'});return;}
   const actual=d[destino];
   const destVacio=actual==null||actual===''||(typeof actual==='object'&&!Object.values(actual).some(x=>x!=null&&x!==''));
   if(destVacio){d[destino]=v;delete d[pid];res.movidos.push({que:rotulo,nombre:plantas[destino],detalle:'se paso a "'+plantas[destino]+'"'});}
   else if(typeof v==='object'&&typeof actual==='object'){
    // se completan solo los huecos: un valor ya cargado nunca se pisa
    let paso=0,choco=[];
    Object.keys(v).forEach(k=>{
     if(v[k]==null||v[k]==='')return;
     if(actual[k]==null||actual[k]===''){actual[k]=v[k];paso++;}
     else if(String(actual[k])!==String(v[k]))choco.push(k);
    });
    if(paso)res.movidos.push({que:rotulo,nombre:plantas[destino],detalle:paso+' valor(es) pasados a "'+plantas[destino]+'"'});
    if(choco.length)res.conflictos.push({que:rotulo,nombre:plantas[destino],
     detalle:'"'+plantas[destino]+'" ya tenia otro valor para: '+choco.join(', ')+'. No se toco nada.'});
    if(!choco.length)delete d[pid];
   }else{
    res.conflictos.push({que:rotulo,nombre:plantas[destino],detalle:'"'+plantas[destino]+'" ya tenia un valor cargado. No se toco nada.'});
   }
  });
 });

 // --- 3. listas que cuelgan de la planta (silobolsas, otras estructuras, MSI)
 const listas=[['silobolsas','silobolsas'],['otrosExtra','otras estructuras']];
 listas.forEach(([campo,rotulo])=>{
  const d=data[campo]; if(!d)return;
  Object.keys(d).forEach(pid=>{
   if(plantas[pid])return;
   const arr=d[pid]||[];
   if(!arr.length){delete d[pid];return;}
   const destino=MIGRACIONES.plantas[pid];
   if(!destino||!plantas[destino]){res.huerfanos.push({que:rotulo,id:pid,detalle:arr.length+' cargada(s), la planta ya no existe'});return;}
   if((d[destino]||[]).length){
    res.conflictos.push({que:rotulo,nombre:plantas[destino],
     detalle:'"'+plantas[destino]+'" ya tiene '+d[destino].length+', y quedaron '+arr.length+' de la planta vieja. No se toco nada.'});
    return;
   }
   d[destino]=arr; delete d[pid];
   res.movidos.push({que:rotulo,nombre:plantas[destino],detalle:arr.length+' pasada(s) a "'+plantas[destino]+'"'});
  });
 });
 // mercaderia sin impacto: ingresos y egresos por separado
 const msi=data.mercSinImpacto;
 if(msi)Object.keys(msi).forEach(pid=>{
  if(plantas[pid])return;
  const v=msi[pid]||{}; const ing=Array.isArray(v)?v:(v.ingresos||[]); const egr=Array.isArray(v)?[]:(v.egresos||[]);
  if(!ing.length&&!egr.length){delete msi[pid];return;}
  const destino=MIGRACIONES.plantas[pid];
  if(!destino||!plantas[destino]){res.huerfanos.push({que:'mercaderia sin impacto',id:pid,detalle:(ing.length+egr.length)+' movimiento(s), la planta ya no existe'});return;}
  const dst=msi[destino]||{ingresos:[],egresos:[]};
  if((dst.ingresos||[]).length||(dst.egresos||[]).length){
   res.conflictos.push({que:'mercaderia sin impacto',nombre:plantas[destino],detalle:'"'+plantas[destino]+'" ya tiene movimientos cargados. No se toco nada.'});
   return;
  }
  msi[destino]={ingresos:ing,egresos:egr}; delete msi[pid];
  res.movidos.push({que:'mercaderia sin impacto',nombre:plantas[destino],detalle:(ing.length+egr.length)+' movimiento(s) pasados a "'+plantas[destino]+'"'});
 });
 return res;
}

function calcPlantTotals(plantas,data,config){
 const t={};
 (plantas||[]).forEach(p=>{
 const bg={}; const sinMedir=[];
 (p.silos||[]).forEach(s=>{
 if(s.tipo==='cilindrico'||!s.tipo){
 const e=data.entries?.[s.id];
 if(e?.grano&&e.grano!=='VACIO'){const pe=e.peLocal||getPE(e.grano,data,config);const r=calcCil(s,e,pe);
  if(r.sinMedidas)sinMedir.push(s.nombre); else acum(bg,e.grano,r.kg,sinMedir,s.nombre);}
 }else if(s.tipo==='celda'){
 const e=data.celdaEntries?.[s.id];
 if(e?.grano&&e.grano!=='VACIO'){const{kg}=filaCelda(s,e,data,config);acum(bg,e.grano,kg,sinMedir,s.nombre);}
 }else if(s.tipo==='silobolsa'){
 const e=data.entries?.[s.id];
 if(e?.grano&&e?.metros){const kgm=getKGM(e.grano,data,config);const{kg}=calcSB(e,kgm);acum(bg,e.grano,kg,sinMedir,s.nombre);}
 }else if(s.tipo==='otro'){
 const e=data.entries?.[s.id];
 if(e?.grano&&e.grano!=='VACIO'&&e?.tnDirecto){acum(bg,e.grano,e.tnDirecto*1000,sinMedir,s.nombre);}
 }
 });
 (data.silobolsas?.[p.id]||[]).forEach(sb=>{
 if(sb?.grano&&sb?.metros){const kgm=sb.kgmLocal||getKGM(sb.grano,data,config);const{kg}=calcSB(sb,kgm);acum(bg,sb.grano,kg,sinMedir,'Silobolsa '+(sb.grano||''));}
 });
 (data.otrosExtra?.[p.id]||[]).forEach(ot=>{
 if(ot?.grano&&ot.grano!=='VACIO'&&ot?.tnDirecto){acum(bg,ot.grano,ot.tnDirecto*1000,sinMedir,ot.nombre||'Otra estructura');}
 });
 t[p.id]={byGrano:bg,libros:data.libros?.[p.id]||{},arca:data.arca?.[p.id]||{},sinMedir};
 });
 return t;
}

/* ===== COMPARACION CUBICAJE vs LIBROS/ARCA =====
   Distinguimos tres estados, no dos:
     - campo vacio  -> SIN DATO: no lo entregaron. No se calcula diferencia.
     - campo en 0   -> DATO REAL: informaron cero. Todo el fisico es sobrante.
     - campo con nro-> DATO REAL: se compara normalmente.
   Tratar el vacio como cero inflaba las diferencias y disparaba
   recomendaciones falsas. */
function tieneDato(o,g){
 if(!o)return false;
 const v=o[g];
 return v!=null&&v!==''&&!isNaN(Number(v));
}
/* ¿La planta entrego algun valor? (un 0 cuenta como entregado) */
function hayAlgunDato(o){
 return !!o&&Object.keys(o).some(g=>tieneDato(o,g));
}
/* Suma el cubicaje SOLO de los cereales que tienen contraparte cargada, para
   que el TOTAL compare lo mismo de los dos lados. */
function totalPareado(granos,byGrano,ref){
 let cub=0,rf=0,n=0;
 (granos||[]).forEach(g=>{
  if(tieneDato(ref,g)){cub+=(byGrano?.[g]||0)/1000;rf+=Number(ref[g]);n++;}
 });
 return{cub,ref:rf,n};
}
/* Cereales cubicados que no tienen contraparte cargada (para observaciones). */
function granosSinDato(granos,byGrano,ref){
 return (granos||[]).filter(g=>!tieneDato(ref,g)&&(byGrano?.[g]||0)>0);
}
/* Porcentaje de desvio. Si la referencia es 0 no existe el %, se informa
   aparte como sobrante total. */
function pctODash(dif,ref){
 return Number(ref)===0?'&mdash;':fPct(dif/ref);
}

/* ===== SILOBOLSAS: parser de metros =====
   Acepta sumas y multiplicaciones para no tener que escribir
   75+75+75+75 cuando hay varias bolsas iguales.
     "4x75"          -> 4 bolsas de 75 m  = 300 m
     "4x75+3x60+40"  -> 8 bolsas          = 520 m
     "60+60+40"      -> 3 bolsas          = 160 m  (formato viejo, sigue andando)
   Convencion FIJA: cantidad x metros. Siempre se muestra el desglose
   en pantalla para que el auditor vea si lo escribio al reves. */
function parseSegmentos(txt){
 // La coma tiene dos usos: decimal (62,5) y separador (75, 75, 60).
 // Regla: pegada a los digitos = decimal; seguida de espacio = separador.
 // Asi ninguno de los dos se pierde en silencio.
 const partes=String(txt||'').replace(/;/g,'+').replace(/,(?=\s)/g,'+').split('+');
 let metros=0,cantidad=0;const detalle=[];
 partes.forEach(p=>{
  const t=p.trim();if(!t)return;
  const m=t.match(/^(\d+(?:[.,]\d+)?)\s*[xX*]\s*(\d+(?:[.,]\d+)?)$/);
  if(m){
   const n=parseFloat(m[1].replace(',','.')),met=parseFloat(m[2].replace(',','.'));
   if(!isNaN(n)&&!isNaN(met)&&n>0){metros+=n*met;cantidad+=n;detalle.push({n,met});}
  }else{
   const v=parseFloat(t.replace(',','.'));
   if(!isNaN(v)){metros+=v;cantidad+=1;detalle.push({n:1,met:v});}
  }
 });
 return{metros:Math.round(metros*100)/100,cantidad,detalle};
}
/* Texto legible del desglose, ej: "4 x 75 m + 3 x 60 m + 40 m" */
function desgloseSB(det){
 return (det||[]).map(x=>x.n>1?(x.n+' x '+x.met+' m'):(x.met+' m')).join('  +  ');
}

/* ===== CAPTURA DE FOTOS =====
   Dos botones en vez de un "Elegir archivo":
     Camara  -> capture="environment" abre DIRECTO la camara trasera del celu
     Galeria -> sin capture, permite elegir una foto ya sacada o recibida
   Hacen falta los dos: el capture abre la camara pero bloquea la galeria,
   y a veces el auditor ya tiene la foto en el telefono. */
function fotoBtns(handler,label){
 const l=label?`<span class="lbl">${label}</span>`:'';
 return `${l}<div class="row mt6" style="gap:6px">`
 +`<label class="btn-out" style="flex:1;text-align:center;cursor:pointer;font-size:12px;margin:0;padding:8px 6px">&#x1F4F7; C&aacute;mara`
 +`<input type="file" accept="image/*" capture="environment" onchange="${handler}" class="file-hidden"></label>`
 +`<label class="btn-out" style="flex:1;text-align:center;cursor:pointer;font-size:12px;margin:0;padding:8px 6px">&#x1F5BC; Galer&iacute;a`
 +`<input type="file" accept="image/*" onchange="${handler}" class="file-hidden"></label>`
 +`</div>`;
}
/* Version para los "+ Agregar otra foto" que crean el input por JS. */
function abrirSelectorFoto(modo,cb){
 const inp=document.createElement('input');
 inp.type='file';inp.accept='image/*';
 if(modo==='camara')inp.capture='environment';
 inp.className='file-hidden';
 // Safari en iPhone puede no abrir camara/galeria si el input no esta
 // realmente insertado en la pagina. Se agrega, se usa, y se saca despues.
 document.body.appendChild(inp);
 inp.onchange=(ev)=>{
  const f=ev.target.files[0];
  if(f)cb(f);
  inp.remove();
 };
 inp.click();
}

/* ===== ULTIMO VACIAMIENTO DE PLANTA =====
   Se registra POR GRANO y POR PLANTA, segun lo que informa el personal de la
   cooperativa. Es una declaracion, no una medicion: por eso se guarda tambien
   quien lo informo.

   Para que sirve: si una planta no se vacia, la diferencia de cada campania
   queda escondida dentro del margen de error del cubicaje (8-10%) y se
   acumula ano tras ano. Recien aparece de golpe cuando se vacia, con un
   faltante grande que nadie vio venir. Registrarlo lo vuelve rastreable. */
const VACIADO_OPC=[
 {v:'actual', t:'En esta campa&ntilde;a',      nivel:0},
 {v:'c1',     t:'Hace 1 campa&ntilde;a',       nivel:0},
 {v:'c2',     t:'Hace 2 campa&ntilde;as',      nivel:1},
 {v:'c3',     t:'Hace 3 campa&ntilde;as',      nivel:2},
 {v:'c3mas',  t:'M&aacute;s de 3 campa&ntilde;as', nivel:2},
 {v:'nosabe', t:'No se pudo precisar',         nivel:2},
];
function vaciadoOpc(v){return VACIADO_OPC.find(o=>o.v===v)||null;}
function vaciadoNivel(v){const o=vaciadoOpc(v);return o?o.nivel:-1;}
/* Texto plano de la opcion, para el informe. */
function vaciadoTexto(v){
 const o=vaciadoOpc(v);if(!o)return'';
 return o.t.replace(/&ntilde;/g,'\u00f1').replace(/&aacute;/g,'\u00e1').replace(/&oacute;/g,'\u00f3');
}
/* Granos que se midieron en una planta (para saber cuales hay que preguntar). */
function granosDePlanta(pt){
 if(!pt||!pt.byGrano)return[];
 return Object.keys(pt.byGrano).filter(g=>g!=='VACIO'&&(pt.byGrano[g]||0)>0);
}

/* Barra que se agrega arriba de cada informe.
   En iPhone, con la app instalada en la pantalla de inicio, la ventana que se
   abre NO tiene barra de Safari: no hay boton de compartir ni de volver.
   Esta barra los reemplaza. Al imprimir no se ve. */
function conBarra(html,nombreArchivo){
 var nom=nombreArchivo||'informe.html';
 var css='<sty'+'le>'
  +'.barra-app{position:sticky;top:0;z-index:99;display:flex;gap:8px;padding:10px;'
  +'background:#2d5016;margin:-20px -20px 16px;flex-wrap:wrap;justify-content:center}'
  +'.barra-app button{flex:1 1 auto;min-width:104px;padding:11px 10px;border:0;border-radius:8px;'
  +'font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}'
  +'.b-vol{background:#fff;color:#2d5016}.b-com{background:#c8982a;color:#fff}.b-pdf{background:#4a7030;color:#fff}'
  +'@media print{.barra-app{display:none}}'
  +'<'+'/sty'+'le>';
 var barra='<div class="barra-app">'
  +'<button class="b-vol" onclick="volverApp()">&#8592; Volver a la app</button>'
  +'<button class="b-pdf" onclick="window.print()">&#128424; PDF</button>'
  +'<button class="b-com" onclick="compartirInforme()">&#128228; Compartir</button>'
  +'</div>';
 var js='<scr'+'ipt>'
  +'function volverApp(){try{window.close()}catch(e){}'
  +'setTimeout(function(){if(!window.closed){if(history.length>1){history.back()}else{'
  +'document.body.insertAdjacentHTML("afterbegin",\'<div style="background:#fff3e0;'
  +'border-left:4px solid #e0a050;padding:12px;margin-bottom:12px;font-size:13px">'
  +'Cerra esta pestana para volver a Cubicaje.<\\/div>\')}}},250)}'
  +'function compartirInforme(){'
  +'var nom='+JSON.stringify(nom)+';'
  +'var cont="<!DOCT"+"YPE html>"+document.documentElement.outerHTML;'
  +'try{var f=new File([cont],nom,{type:"text/html"});'
  +'if(navigator.canShare&&navigator.canShare({files:[f]})){'
  +'navigator.share({files:[f],title:nom});return}}catch(e){}'
  +'var bl=new Blob([cont],{type:"text/html"});var a=document.createElement("a");'
  +'a.href=URL.createObjectURL(bl);a.download=nom;document.body.appendChild(a);a.click();'
  +'setTimeout(function(){a.remove()},500);'
  +'alert("Se descargo el archivo. Compartilo desde Archivos o Descargas.")}'
  +'<\/scr'+'ipt>';
 html=html.replace('</he'+'ad>', css+'</he'+'ad>');
 html=html.replace('<bo'+'dy>', '<bo'+'dy>'+barra);
 html=html.replace('</bo'+'dy>', js+'</bo'+'dy>');
 return html;
}

/* Abre un informe en una pestana nueva.
   Antes se usaba document.write, pero Safari no ejecuta los <script> escritos
   asi y los botones de la barra quedaban muertos. Con un Blob URL el navegador
   lo trata como una pagina normal y todo funciona. */
function abrirInforme(html,nombreArchivo){
 html=conBarra(html,nombreArchivo);
 try{
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){setTimeout(()=>URL.revokeObjectURL(url),60000);return true;}
  // sin ventana emergente: se descarga para que lo abran a mano
  const a=document.createElement('a');
  a.href=url;a.download=nombreArchivo||'informe.html';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1000);
  alert('Se descarg\u00f3 el informe. Abrilo desde Archivos o Descargas.');
  return true;
 }catch(e){
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();return true;}
  alert('Permit\u00ed las ventanas emergentes para ver el informe.');
  return false;
 }
}

// Cuenta las fotos del cubicaje abierto y cuanto pesan, para poder avisar ANTES de
// que el almacenamiento se llene. Cada foto se guarda como texto base64: una foto de
// camara comprimida ronda los 300 KB, y el navegador da unos 5 MB en total.
function getFotoInfo(){
 const d=S.activeData;
 if(!d)return{n:0,bytes:0,items:[]};
 const items=[]; let n=0,bytes=0;
 const sumar=(nombre,foto,extras)=>{
  let b=0,c=0;
  if(foto){b+=foto.length;c++;}
  (extras||[]).forEach(f=>{if(f){b+=f.length;c++;}});
  if(c){items.push({nombre,n:c,bytes:b});n+=c;bytes+=b;}
 };
 const coop=S.config.cooperativas.find(c=>c.id===(S.sessions.find(x=>x.id===S.activeId)||{}).coopId);
 (coop?.plantas||[]).forEach(pl=>{
  (pl.silos||[]).forEach(st=>{
   const e=d.entries?.[st.id]; if(e)sumar(st.nombre,e.foto,e.fotosExtra);
   const c=d.celdaEntries?.[st.id]; if(c)sumar(st.nombre,c.foto,c.fotosExtra);
  });
  (d.otrosExtra?.[pl.id]||[]).forEach((ot,i)=>sumar(ot?.nombre||('Otra estructura '+(i+1)),ot?.foto,ot?.fotosExtra));
  (d.silobolsas?.[pl.id]||[]).forEach((sb,i)=>sumar('Silobolsa '+(sb?.grano||('#'+(i+1))),sb?.foto,sb?.fotosExtra));
  ['fotoLibros','fotoArca'].forEach(k=>{
   let arr=d[k]?.[pl.id]; if(!arr)return; if(!Array.isArray(arr))arr=[arr];
   sumar(k==='fotoLibros'?'Listado de Libros':'Listado de ARCA',null,arr);
  });
 });
 items.sort((x,y)=>y.bytes-x.bytes);
 return{n,bytes,items};
}

 const color=pct>90?'var(--danger)':pct>70?'var(--accent)':'var(--primary)';
 return{mb,pct,color};}catch(e){return{mb:'?',pct:0,color:'var(--primary)'};}
}

// Barrita de espacio, visible durante toda la visita desde la primera foto.
// El auditor no tiene que acordarse de ir a mirarla: si se esta llenando, la ve.
function indicadorFotos(){
 const fi=getFotoInfo();
 if(!fi.n)return'';
 const st=getStorageInfo();
 const pct=Number(st.pct)||0;
 const col=pct>=90?'var(--danger)':pct>=70?'var(--accent)':'var(--primary)';
 const mb=(fi.bytes*2/1024/1024);
 const abierto=S.verFotos?'block':'none';
 let h=`<div style="padding:6px 12px;border-bottom:1px solid var(--border);background:var(--bg)">`
  +`<div onclick="window.toggleVerFotos()" style="display:flex;align-items:center;gap:8px;cursor:pointer">`
  +`<span style="font-size:11px;color:var(--textS)">&#x1F4F7; ${fi.n} foto${fi.n===1?'':'s'}</span>`
  +`<div style="flex:1;background:var(--border);border-radius:4px;height:5px;overflow:hidden"><div style="background:${col};height:100%;width:${Math.min(100,pct)}%"></div></div>`
  +`<span style="font-size:11px;color:${col};font-weight:600">${st.mb} MB de ~5 (${st.pct}%)</span>`
  +`<span style="font-size:11px;color:var(--textS)">${S.verFotos?'&#x25BE;':'&#x25B8;'}</span></div>`;
 if(pct>=70)h+=`<div style="font-size:11px;color:${col};margin-top:4px">${pct>=90?'Casi sin lugar. Export&aacute; el cubicaje ahora.':'Se est&aacute; llenando. Convien&eacute; exportar antes de seguir sacando fotos.'}</div>`;
 h+=`<div style="display:${abierto};margin-top:6px">`
  +`<div style="font-size:11px;color:var(--textS);margin-bottom:4px">Las fotos de este cubicaje ocupan ${mb.toFixed(1)} MB. De mayor a menor:</div>`;
 fi.items.slice(0,12).forEach(it=>{
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid var(--border)"><span>${esc(it.nombre)}${it.n>1?' ('+it.n+' fotos)':''}</span><span style="color:var(--textS)">${(it.bytes*2/1024/1024).toFixed(2)} MB</span></div>`;
 });
 if(fi.items.length>12)h+=`<div style="font-size:11px;color:var(--textS);margin-top:4px">y ${fi.items.length-12} estructuras m&aacute;s</div>`;
 h+=`</div></div>`;
 return h;
}
window.toggleVerFotos=()=>{S.verFotos=!S.verFotos;render();};

function renderCubicaje(){
 const sess=S.sessions.find(s=>s.id===S.activeId);
 if(!sess)return'';
 const coop=S.config.cooperativas.find(c=>c.id===sess.coopId);
 const plantas=coop?.plantas||[];
 const tab=S.activeTab||(plantas[0]?.id||'resumen');
 const d=S.activeData||{entries:{},celdaEntries:{},silobolsas:{},libros:{}};
 const ptotals=calcPlantTotals(plantas,d,S.config);

 let h=`<div class="hdr"><button class="hbtn" onclick="goHome()">&larr;</button><div style="flex:1"><h1>${sess.coopName}</h1>${sess.auditores?'<div class="hdr-sub">'+sess.auditores+(fmtPeriodo(sess)?' | '+fmtPeriodo(sess):'')+'</div>':''}</div></div>`;
 h+=`<div class="tabs">`;
 plantas.forEach(p=>{h+=`<button class="${tab===p.id?'act':''}" onclick="setTab('${p.id}')">${p.nombre}</button>`;});
 h+=`<button class="${tab==='peOverride'?'act':''}" onclick="setTab('peOverride')">&#x2696; PH</button>`;

 h+=indicadorFotos();
 // Si al abrir este cubicaje hubo que mudar datos por un cambio de configuracion,
 // el auditor tiene que verlo antes que nada.
 h+=avisoMigracion(S.migracion);

 if(tab==='resumen'){

 }else if(tab==='exportar'){
 // Trabajo en equipo

 <p style="font-size:12px;color:var(--textS);margin-bottom:10px"><b>Antes del campo:</b> envi&aacute; el cubicaje al compa&ntilde;ero. <b>Despu&eacute;s:</b> envi&aacute; tus datos para unificar.</p>

 <div style="display:flex;gap:6px;flex-wrap:wrap"><label class="btn-out" style="flex:1;text-align:center;cursor:pointer;font-size:13px">&#x1F4E5; Recibir del compa&ntilde;ero<input type="file" accept="*/*" onchange="importarArchivo(this,'merge')" style="display:none"></label></div></div>`;

 // Riesgos y Recomendaciones
 const recsDefault=['Realizaci&oacute;n peri&oacute;dica de cubicajes en todas las plantas de silos.','Vaciamiento de las mismas, en lo posible todos los a&ntilde;os.','Evitar retrasos en la registraci&oacute;n de ingresos y egresos de mercader&iacute;a.','Llevar de forma sincronizada entre el sistema y el stock f&iacute;sico los movimientos que se vayan produciendo.','Computar en el sistema toda la mercader&iacute;a que ingresa f&iacute;sicamente.','Realizar los pases pertinentes entre secciones para evitar desv&iacute;os entre el f&iacute;sico y el libro de existencias.','Seguimiento y conciliaci&oacute;n de existencias de cereales entre el stock ARCA y el libro de existencias generado por el sistema.','En caso de diferencias (sobrantes o faltantes), analizarlas, justificarlas y realizar las correcciones pertinentes.'];
 if(!d.recomendaciones){d.recomendaciones=recsDefault.map((r,i)=>({id:i,texto:r,activa:true}));saveActive();}
 if(!d.riesgosCustom)d.riesgosCustom=[];

 h+=`</div>`;
 // Excel
 h+=`<div class="card"><span class="lbl">&#x1F4CA; Datos</span><p style="font-size:12px;color:var(--textS);margin-bottom:8px">Descarga todos los datos relevados en formato Excel.</p><button class="btn-out" onclick="exportExcel()">&#x1F4CA; Descargar Excel</button></div>`;
 }else if(tab==='peOverride'){
 h+=renderPEOverride(d);
 }else{
 const pl=plantas.find(p=>p.id===tab);
 if(pl)h+=renderPlant(pl,d,ptotals[pl.id]);
 }
 return h;
}

function renderPEOverride(data){

 getAllGranoKeys(S.config).forEach(g=>{

 const rng=PE_RANGOS[g]||[0,1000];

 h+=`</div>`;

 // Show effective PE summary
 h+=`<div class="card card-green"><span class="lbl" style="color:var(--primary)">PH efectivo en este cubicaje</span>`;
 h+=`<table><thead><tr><th>Cereal</th><th>PH (kg/m&#179;)</th><th>Origen</th></tr></thead><tbody>`;
 getAllGranoKeys(S.config).forEach(g=>{
 const ovVal=ov[g];
 const cfVal=S.config.peConfig?.[g];
 const eff=getPE(g,data,S.config);
 const origen=ovVal?'<b style="color:var(--accent)">Ajuste cubicaje</b>':cfVal&&cfVal!==PE_DEFAULTS[g]?'Config personalizado':'Por defecto';
 h+=`<tr><td style="font-weight:600">${g}</td><td>${eff}</td><td style="font-size:11px">${origen}</td></tr>`;

 // KGM override for this cubicaje
 const ovk=data.kgmOverride||{};
 h+=`<div class="card" style="background:#f0f4ff;border-color:#7b8fba"><span class="lbl" style="color:#4a5d8a"> Silobolsa: kg/m para este cubicaje</span>`;
 h+=`<div style="font-size:12px;color:var(--textS);margin-bottom:8px">Si los silobolsas est&aacute;n m&aacute;s o menos llenos de lo normal, ajust&aacute; el kg por metro ac&aacute;.</div>`;
 getAllGranoKeys(S.config).forEach(g=>{
 const def=getKGM(g,{},S.config);
 const v=ovk[g]||'';
 h+=`<div class="row mb6"><span style="width:70px;font-size:13px;font-weight:700">${g}</span><input type="text" inputmode="decimal" value="${v}" onchange="setKGMOverride('${g}',this.value?numVal(this.value):null)" placeholder="${def}" style="flex:1"><span style="font-size:10px;color:var(--textS);width:85px;text-align:right">defecto: ${def}</span></div>`;
 });
 h+=`<button class="btn-out mt8" onclick="clearKGMOverride()" style="text-align:center;font-size:12px">Limpiar ajustes</button>`;
 h+=`</div>`;

 return h;
}

 if(open){

  h+=`<div class="g2 mt8"><div><span class="lbl">Metros vac&iacute;os desde arriba</span><input type="text" inputmode="decimal" step="0.1" min="0" max="${altT}" value="${vac}" onchange="setVacios('${silo.id}',${altT},${silo.altChapa||1},this.value,${pcMed})"><div style="font-size:11px;color:var(--textS);margin-top:2px">altura total ${altT} m${pcMed>0?' (incluye el fondo de '+pcMed+' m)':''}</div></div><div><span class="lbl">${silo.baseCemento?'Base de cemento ('+silo.altConoSup+' m)':'Direcci&oacute;n del cono'}</span>${conoHtml(e.cono??0,silo.baseCemento)}</div></div>`;
  if(llenos!=null){

 }

 if(silo.falda>0){h+=`<div class="mt8"><span class="lbl">% falda llena (${silo.falda}m) (defecto: 100%)</span><input type="text" inputmode="decimal" min="0" max="100" value="${e.pctFalda!=null?e.pctFalda:''}" onchange="setEntry('${silo.id}','pctFalda',this.value?numVal(this.value):null)" placeholder="100" style="width:120px"></div>`;}
 h+=`<div class="g2 mt8"><div><span class="lbl">PH particular (dejar vac&iacute;o = ${pe})</span><input type="text" inputmode="decimal" value="${e.peLocal||''}" onchange="setEntry('${silo.id}','peLocal',this.value?numVal(this.value):null)" placeholder="${pe}"></div><div><span class="lbl">Tn declaradas (pisa la medici&oacute;n)</span><input type="text" inputmode="decimal" value="${e.tnDirecto||''}" onchange="setEntry('${silo.id}','tnDirecto',this.value?numVal(this.value):null)" placeholder="solo si no se midi&oacute;"></div></div>`;
 if(e.tnDirecto)h+=`<div class="info-box" style="border-color:var(--warn,#d98324)">Este silo <b>no se cubic&oacute;</b>: se tomaron <b>${e.tnDirecto} tn</b> declaradas por la planta. El c&aacute;lculo por chapas queda sin efecto.</div>`;

 h+=`<div class="mt6">${fotoBtns(`handlePhoto('${silo.id}',this)`,'Fotos')}`;
 if(e.foto)h+=`<div class="mt6"><img src="${e.foto}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border)"><button class="btn-x" onclick="borrarFotoPpal('silo','${silo.id}')" style="font-size:10px">x</button></div>`;
 const fExtras=e.fotosExtra||[];
 fExtras.forEach((f,fi)=>{h+=`<div class="mt6"><img src="${f}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border)"><button class="btn-x" onclick="removeFotoExtra('${silo.id}',${fi},'silo')" style="font-size:10px">x</button></div>`;});
 if(e.foto)h+=`<div class="row mt6" style="gap:6px"><button class="btn-out" style="flex:1;font-size:11px" onclick="addFotoExtra('${silo.id}','silo','camara')">&#x1F4F7; Otra con c&aacute;mara</button><button class="btn-out" style="flex:1;font-size:11px" onclick="addFotoExtra('${silo.id}','silo','galeria')">&#x1F5BC; De galer&iacute;a</button></div>`;
 h+=`</div>`;
 h+=detalleHtml(r.partes,r.m3,pe,r.kg,{compact:r.compact,recortado:r.recortado});
 h+=`<div class="info-box">${silo.diametro}m &#183; Chapa ${silo.altChapa}m &#183; Cono inf ${silo.profCono}m &#183; Cono sup ${silo.altConoSup}m &#183; <b>PH: ${e.peLocal||pe}</b>${silo.compact?` &#183; <b>compactaci&oacute;n ${String(silo.compact).replace('.',',')}</b>`:''}</div></div>`;
 }
 h+=`</div>`;
 });

 // Celdas y elevadores (secciones separadas)
 if(celdas.length)h+=`<div class="sec-title">Celdas</div>`;
 [...celdas,...(elevs.length?[{__sep:1}]:[]),...elevs].forEach(c=>{
 if(c.__sep){h+=`<div class="sec-title">&#x1F3D7; Elevadores <span style="font-weight:400;font-size:11px;color:var(--textS)">(se miden por metros vac&iacute;os desde arriba)</span></div>`;return;}
 const e=data.celdaEntries?.[c.id]||{};
 const _fc=filaCelda(c,e,data,S.config);
 const peBase=_fc.peBase, pe=_fc.pe, peT=_fc.peT, r=_fc.r, met=_fc.met;
 const hasCap=c.capacidad>0;
 const hasDim=(c.largo>0&&c.ancho>0)||(e.largoLocal>0&&e.anchoLocal>0);
 const open=S.expanded===c.id;
 h+=`<div class="card"><div class="silo-hdr" onclick="toggleSilo('${c.id}')"><div style="flex:1"><span style="font-weight:700">${c.nombre}</span>${e.grano&&e.grano!=='VACIO'?`<span class="badge" style="background:${GRANOS[e.grano]?.color||'#999'}">${e.grano}</span>`:e.grano==='VACIO'?'<span class="badge" style="background:#7b8ea3">VAC&Iacute;O</span>':''}${!c.capacidad&&!c.largo&&!c.elevador?'<span class="badge" style="background:var(--danger)" title="Falta cargar las medidas de esta celda en Config">SIN MEDIDAS</span>':''}${granoHuerfano(e.grano)?'<span class="badge" style="background:var(--danger)" title="Este grano ya no esta en la lista: revisalo o la celda va a cubicar en cero">GRANO SIN PH</span>':''}</div><div style="text-align:right"><div style="font-weight:700;font-size:15px">${fTn(r.kg)} tn</div></div><span style="color:var(--textS);font-size:16px;margin-left:4px">${open?'':''}</span></div>`;
 if(open){
 h+=`<div class="silo-body">`;
 // Info line
 const infoParts=[];
 if(c.largo&&c.ancho&&c.altura)infoParts.push(c.largo+'\u00d7'+c.ancho+'\u00d7'+c.altura+'m = '+(c.largo*c.ancho*c.altura).toFixed(0)+' m\u00b3'+(c.capacidad?' ('+c.capacidad+' tn trigo)':''));
 else if(hasCap)infoParts.push('Cap: '+c.capacidad+' tn (trigo)');
 if(c.largo)infoParts.push(c.largo+'&#215;'+c.ancho+'&#215;'+c.altura+'m');
 if(c.profConoCelda)infoParts.push('Cono inf: '+c.profConoCelda+'m');
 if(infoParts.length)h+=`<div class="info-box mb6">${infoParts.join(' &#183; ')}</div>`;
 // Grano + PE
 h+=`<div class="g2"><div><span class="lbl">Grano</span><select onchange="setCelda('${c.id}','grano',this.value)">${granoOpts(e.grano,true)}</select></div><div><span class="lbl">PH particular (vac&iacute;o = ${peBase})</span><input type="text" inputmode="decimal" value="${e.peLocal||''}" onchange="setCelda('${c.id}','peLocal',this.value?numVal(this.value):null)" placeholder="${peBase}"></div></div>`;
 // Method pills
 h+=`<div class="mt8 mb6"><span class="lbl">M&eacute;todo de c&aacute;lculo</span><div style="display:flex;gap:4px">`;
 if(hasCap)h+=`<button class="pill ${met==='capacidad'?'pill-on':'pill-off'}" onclick="setCelda('${c.id}','metodo','capacidad')">Por capacidad</button>`;
 h+=`<button class="pill ${met==='medidas'?'pill-on':'pill-off'}" onclick="setCelda('${c.id}','metodo','medidas')">Por medidas</button>`;
 h+=`<button class="pill ${met==='directo'?'pill-on':'pill-off'}" onclick="setCelda('${c.id}','metodo','directo')">Directo</button>`;
 h+=`</div></div>`;
 // Method inputs
 if(met==='capacidad'&&hasCap){
 const peTrigo=getPE('TRIGO',data,S.config);
 const factor=pe/(peTrigo||800);
 const capGrano=c.capacidad*factor;
 const resTn=capGrano*(e.pctLleno||0)/100;
 if(e.grano&&e.grano!=='TRIGO'&&e.grano!=='VACIO')h+=`<div style="font-size:11px;color:var(--primary);margin-bottom:4px">Cap: ${c.capacidad} tn (trigo) <b>${Math.round(capGrano)} tn</b> en ${e.grano} (PH ${pe}/${peTrigo})</div>`;
 h+=`<div class="g2"><div><span class="lbl">% Lleno</span><input type="text" inputmode="decimal" min="0" max="100" value="${e.pctLleno!=null?e.pctLleno:''}" onchange="setCelda('${c.id}','pctLleno',this.value?numVal(this.value):null);setCelda('${c.id}','metrosVacios',null)" placeholder="0-100"></div><div><span class="lbl">Resultado</span><div style="padding:9px 10px;background:var(--primaryL);border-radius:7px;font-weight:700;font-size:15px">${e.pctLleno!=null?resTn.toLocaleString('es-AR',{maximumFractionDigits:0})+' tn':''}</div></div></div>`;
 if(c.elevador&&c.altura>0){const altT=c.altura;h+=`<div class="g2 mt6"><div><span class="lbl">Metros vac&iacute;os desde arriba (alt: ${altT}m)</span><input type="text" inputmode="decimal" min="0" max="${altT}" value="${e.metrosVacios!=null?e.metrosVacios:''}" onchange="const mv=this.value?numVal(this.value):null;setCelda('${c.id}','metrosVacios',mv);if(mv!=null)setCelda('${c.id}','pctLleno',Math.round((${altT}-mv)/${altT}*100))" placeholder="metros con l&aacute;ser"></div><div><span class="lbl">Metros llenos</span><div style="padding:9px 10px;background:var(--accentL);border-radius:7px;font-weight:600;font-size:13px">${e.metrosVacios!=null?(altT-e.metrosVacios).toFixed(1)+' m de '+altT+' m':''}</div></div></div>`;}
 
 }else if(met==='medidas'){
 h+=`<div class="g3 mt6"><div><span class="lbl">Largo (m)</span><input type="text" inputmode="decimal" value="${e.largoLocal||''}" onchange="setCelda('${c.id}','largoLocal',this.value?numVal(this.value):null)" placeholder="${c.largo||0}"></div><div><span class="lbl">Ancho (m)</span><input type="text" inputmode="decimal" value="${e.anchoLocal||''}" onchange="setCelda('${c.id}','anchoLocal',this.value?numVal(this.value):null)" placeholder="${c.ancho||0}"></div><div><span class="lbl">Altura grano (m)</span><input type="text" inputmode="decimal" value="${e.altGrano!=null?e.altGrano:''}" onchange="setCelda('${c.id}','altGrano',this.value?numVal(this.value):null)" placeholder="metros"></div></div>`;
 h+=`<div class="g2 mt6"><div><span class="lbl">Cono sup. (m)</span><input type="text" inputmode="decimal" value="${e.altLomo!=null?e.altLomo:''}" onchange="setCelda('${c.id}','altLomo',this.value?numVal(this.value):null)" placeholder="0 = sin cono"></div><div><span class="lbl">Depresi&oacute;n sup. (m)</span><input type="text" inputmode="decimal" value="${e.altDepresion!=null?e.altDepresion:''}" onchange="setCelda('${c.id}','altDepresion',this.value?numVal(this.value):null)" placeholder="0 = sin depresi&oacute;n"></div></div>`;
 const L=e.largoLocal||c.largo||0,W=e.anchoLocal||c.ancho||0,H=e.altGrano||0;
 const profC=c.profConoCelda||0;
 const altLomo=e.altLomo||0;
 const altDep=e.altDepresion||0;
 const vR=L*W*H,vC=H>0?(1/3)*L*W*profC:0;
 // Divisor del copete segun la forma que hace el grano en esa celda:
 //   /2 -> caballete (cresta de punta a punta, celdas alargadas)
 //   /3 -> piramide  (un solo pico al centro, celdas cuadradas)
 // Se respeta lo que usa la planilla de cada cooperativa. Por defecto /3.
 const dv=(c.lomoDiv===2)?2:3;
 // El copete puede no ocupar todo el largo de la celda: si la celda declara
 // un largoLomo propio se usa ese, si no el largo completo.
 const Ll=c.largoLomo||L;
 const vLomo=altLomo>0?(1/dv)*Ll*W*altLomo:0;
 const vDep=altDep>0?(1/dv)*Ll*W*altDep:0;
 const vTotal=vR+vC+vLomo-vDep;
 const volLomoExtra=c.volLomo?c.volLomo*((e.pctLomo!=null?e.pctLomo:0)/100):0;
 // La fosa tambien entra en el resumen de volumen, para que el numero de la linea
 // coincida con el de la tarjeta y con el del informe.
 const volFosaCelda=c.volFosa?(c.volFosa*((e.pctFosa!=null?e.pctFosa:100)/100)):0;

// Firma handlers
let _drawing=false,_lastX=0,_lastY=0;
window.initFirmaCanvas=(canvasId)=>{
 const cv=document.getElementById(canvasId);
 if(!cv||cv._init)return;cv._init=true;
 const ctx=cv.getContext('2d');
 const getPos=(e)=>{
 const r=cv.getBoundingClientRect();
 const t=e.touches?e.touches[0]:e;
 return[(t.clientX-r.left)*(cv.width/r.width),(t.clientY-r.top)*(cv.height/r.height)];
 };
 const start=(e)=>{e.preventDefault();_drawing=true;[_lastX,_lastY]=getPos(e);};
 const move=(e)=>{
 if(!_drawing)return;e.preventDefault();
 const[x,y]=getPos(e);
 ctx.beginPath();ctx.moveTo(_lastX,_lastY);ctx.lineTo(x,y);
 ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
 _lastX=x;_lastY=y;
 };
 const end=()=>{_drawing=false;};
 cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);
 cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
 cv.addEventListener('touchstart',start,{passive:false});
 cv.addEventListener('touchmove',move,{passive:false});
 cv.addEventListener('touchend',end);

window.importarConfig=function(input){
 if(!input.files||!input.files[0])return;
 const reader=new FileReader();
 reader.onload=async function(ev){
 try{
 const pkg=JSON.parse(ev.target.result.trim());

 render();
 }else{

 }
 }catch(e){alert('El archivo est\u00e1 incompleto o da\u00f1ado. Ped\u00ed que te lo reenv\u00eden completo.');}

};

window.setVacios=(siloId,altTotal,altChapa,val,profCono)=>{
 const mv=(val===''||val==null)?null:numVal(val);
 const e={...(S.activeData.entries?.[siloId]||{})};
 if(mv==null){e.metrosVacios=null;e.chapasLlenas=null;e.pctConoAuto=null;}
 else{
  const v=Math.max(0,Math.min(altTotal,mv));
  e.metrosVacios=v;
  const grano=altTotal-v;                 // metros de grano medidos desde el fondo
  const pc=profCono||0;                   // altura del fondo (cono o rampa)
  if(pc>0){
   // altTotal incluye el fondo: los metros de grano se reparten entre el
   // fondo (hasta taparlo) y recien despues el cilindro.
   e.chapasLlenas=+(Math.max(0,grano-pc)/(altChapa||1)).toFixed(4);
   e.pctConoAuto=+Math.min(1,grano/pc).toFixed(4);
  }else{
   e.chapasLlenas=+(grano/(altChapa||1)).toFixed(4);
   e.pctConoAuto=null;
  }
 }
 if(!S.activeData.entries)S.activeData.entries={};
 S.activeData.entries[siloId]=e;
 saveActive();render();
};

window.importarDesdeData=async function(pkg,mode){
 try{
 if(mode==='cubicaje'&&pkg.tipo==='cubicaje_completo'){
  if(pkg.config){
   const existing=S.config;
   if(pkg.cooperativa){
    const idx=existing.cooperativas.findIndex(c=>c.id===pkg.cooperativa.id);
    if(idx>=0)existing.cooperativas[idx]=pkg.cooperativa;
    else existing.cooperativas.push(pkg.cooperativa);
   }
   if(pkg.config.peConfig)existing.peConfig=pkg.config.peConfig;
   if(pkg.config.kgmConfig)existing.kgmConfig=pkg.config.kgmConfig;
   await saveCfg();
  }
  const newId=uid();
  const newSess={...pkg.session,id:newId};
  S.sessions=[newSess,...S.sessions];
  await sSet('cb-index',S.sessions);
  await sSet('cb-data:'+newId,pkg.data||{entries:{},celdaEntries:{},silobolsas:{},libros:{},arca:{}});
  alert('Cubicaje importado: '+(pkg.session?.coopName||''));
  render();
 }else if(mode==='merge'){
  if(!S.activeData||!S.activeId)return alert('Primero abr\u00ed el cubicaje donde quer\u00e9s unificar');
  const incoming=pkg.data||{};
  ['entries','celdaEntries','libros','arca','plantAuditores','plantFechas','firmas'].forEach(k=>{
   if(incoming[k])Object.assign(S.activeData[k]=S.activeData[k]||{},incoming[k]);
  });
  if(incoming.silobolsas)Object.keys(incoming.silobolsas).forEach(k=>{
   S.activeData.silobolsas=S.activeData.silobolsas||{};
   S.activeData.silobolsas[k]=(S.activeData.silobolsas[k]||[]).concat(incoming.silobolsas[k]);
  });
  saveActive();alert('Datos unificados correctamente');render();
 }else{alert('Formato no reconocido');}
 }catch(e){alert('Error al importar: '+e.message);}
};

window.importarArchivo=function(input,mode){
 if(!input.files||!input.files[0])return;
 const reader=new FileReader();
 reader.onload=async function(ev){
 try{
 const raw=ev.target.result.trim();
 const pkg=JSON.parse(raw);
 if(mode==='cubicaje'&&pkg.tipo==='cubicaje_completo'){
 if(pkg.config){
 const existing=await sGet('cb-config',{cooperativas:[]});
 if(pkg.cooperativa){
 const idx=existing.cooperativas.findIndex(c=>c.id===pkg.cooperativa.id);
 if(idx>=0)existing.cooperativas[idx]=pkg.cooperativa;
 else existing.cooperativas.push(pkg.cooperativa);
 }
 if(pkg.config.peConfig)existing.peConfig=pkg.config.peConfig;
 if(pkg.config.kgmConfig)existing.kgmConfig=pkg.config.kgmConfig;
 if(pkg.config.auditoresList)existing.auditoresList=pkg.config.auditoresList;
 await sSet('cb-config',existing);
 S.config=existing;
 }
 const newId=uid();
 const newSess={...pkg.session,id:newId};
 S.sessions=[newSess,...S.sessions];
 await sSet('cb-index',S.sessions);
 await sSet('cb-data:'+newId,pkg.data||{entries:{},celdaEntries:{},silobolsas:{},otrosExtra:{},libros:{},arca:{},auditores:'',plantAuditores:{},plantFechas:{},mercSinImpacto:{},firmas:{}});
 alert('Cubicaje importado: '+(pkg.session?.coopName||''));
 render();
 }else if(mode==='merge'){
 if(!S.activeData||!S.activeId)return alert('Primero abr&iacute; el cubicaje donde quer&eacute;s unificar los datos');
 const incoming=pkg.data||{};
 let merged=0;
 if(incoming.entries){Object.entries(incoming.entries).forEach(([k,v])=>{
 if(v&&v.grano&&(!S.activeData.entries[k]||!S.activeData.entries[k].grano)){S.activeData.entries[k]=v;merged++;}
 });}
 if(incoming.celdaEntries){Object.entries(incoming.celdaEntries).forEach(([k,v])=>{
 if(v&&v.grano&&(!S.activeData.celdaEntries?.[k]||!S.activeData.celdaEntries[k].grano)){
 if(!S.activeData.celdaEntries)S.activeData.celdaEntries={};
 S.activeData.celdaEntries[k]=v;merged++;
 }
 });}
 if(incoming.silobolsas){Object.entries(incoming.silobolsas).forEach(([pId,arr])=>{
 if(arr?.length&&(!S.activeData.silobolsas?.[pId]||!S.activeData.silobolsas[pId].length)){
 if(!S.activeData.silobolsas)S.activeData.silobolsas={};
 S.activeData.silobolsas[pId]=arr;merged+=arr.length;
 }
 });}
 if(incoming.otrosExtra){Object.entries(incoming.otrosExtra).forEach(([pId,arr])=>{
 if(arr?.length&&(!S.activeData.otrosExtra?.[pId]||!S.activeData.otrosExtra[pId].length)){
 if(!S.activeData.otrosExtra)S.activeData.otrosExtra={};
 S.activeData.otrosExtra[pId]=arr;merged+=arr.length;
 }
 });}
 if(incoming.libros){Object.entries(incoming.libros).forEach(([pId,vals])=>{
 if(vals&&(!S.activeData.libros?.[pId]||!Object.values(S.activeData.libros[pId]).some(v=>v))){
 if(!S.activeData.libros)S.activeData.libros={};
 S.activeData.libros[pId]=vals;merged++;
 }
 });}
 if(incoming.arca){Object.entries(incoming.arca).forEach(([pId,vals])=>{
 if(vals&&(!S.activeData.arca?.[pId]||!Object.values(S.activeData.arca[pId]).some(v=>v))){
 if(!S.activeData.arca)S.activeData.arca={};
 S.activeData.arca[pId]=vals;merged++;
 }
 });}
 if(incoming.plantAuditores){Object.entries(incoming.plantAuditores).forEach(([k,v])=>{
 if(v&&!S.activeData.plantAuditores?.[k]){if(!S.activeData.plantAuditores)S.activeData.plantAuditores={};S.activeData.plantAuditores[k]=v;}
 });}
 if(incoming.plantFechas){Object.entries(incoming.plantFechas).forEach(([k,v])=>{
 if(v&&!S.activeData.plantFechas?.[k]){if(!S.activeData.plantFechas)S.activeData.plantFechas={};S.activeData.plantFechas[k]=v;}
 });}
 if(incoming.mercSinImpacto){Object.entries(incoming.mercSinImpacto).forEach(([pId,d])=>{
 if(!S.activeData.mercSinImpacto)S.activeData.mercSinImpacto={};
 if(!S.activeData.mercSinImpacto[pId])S.activeData.mercSinImpacto[pId]={ingresos:[],egresos:[]};
 if(d.ingresos?.length){S.activeData.mercSinImpacto[pId].ingresos=[...S.activeData.mercSinImpacto[pId].ingresos,...d.ingresos];merged+=d.ingresos.length;}
 if(d.egresos?.length){S.activeData.mercSinImpacto[pId].egresos=[...S.activeData.mercSinImpacto[pId].egresos,...d.egresos];merged+=d.egresos.length;}
 });}
 if(incoming.firmas){Object.entries(incoming.firmas).forEach(([k,v])=>{
 if(v&&!S.activeData.firmas?.[k]){if(!S.activeData.firmas)S.activeData.firmas={};S.activeData.firmas[k]=v;}
 });}
 await saveActive();
 alert('Datos unificados. Se incorporaron '+merged+' registros.');
 render();
 }else{
 alert('Formato no reconocido. Asegurate de seleccionar un archivo exportado desde la app.');
 }
 }catch(e){alert('El archivo est\u00e1 incompleto o da\u00f1ado. Ped\u00ed que te lo reenv\u00eden completo.');}
 };
 reader.readAsText(input.files[0]);
 input.value='';
};

 const riesgosVac=[];
 {

   html+=`<h2>&Uacute;ltimo vaciamiento de planta (informado por la cooperativa)</h2>`;

   html+=`<div class="tw"><table><thead><tr><th>Planta</th><th>Grano</th><th>Tn medidas</th><th>&Uacute;ltimo vaciamiento</th><th>Informado por</th><th>Observaci&oacute;n</th></tr></thead><tbody>`;
   filas.forEach(f=>{
    const niv=vaciadoNivel(f.cuando);

   });

   // riesgos por antiguedad

    riesgosVac.push(`La cooperativa informó${quien} que la planta <b>${esc(f.planta)}</b> no realiza el vaciamiento total de <b>${f.grano}</b> desde <b>${vaciadoTexto(f.cuando).toLowerCase()}</b>. Al no efectuarse el vaciamiento, las diferencias entre la existencia física y los registros contables no pueden determinarse con precisión y se acumulan período tras período, quedando enmascaradas dentro del margen de error propio del cubicaje (8-10%). Se recomienda programar el vaciamiento total de dicha mercadería antes del próximo cierre.`);
   });

   }

   }

 // Check differences and connect with MSI
 allG.forEach(g=>{
  const hayL=tieneDato(gLib,g);
  const l=hayL?Number(gLib[g]):0;
  const c=hayL?(gCubL[g]||0):(gAll[g]||0);
  const diff=c-l;
  const pct=l?Math.abs(diff/l):0;
  const msi=msiByGrano[g];
  if(hayL&&l===0&&c>0){
   activeRecs.push(`Seg&uacute;n el listado de existencias del sistema, la cooperativa no registra stock de <b>${g}</b>; sin embargo el cubicaje f&iacute;sico arroj&oacute; <b>${fN(c)} tn</b>. La totalidad de dicha existencia constituye un sobrante no registrado, por lo que corresponde determinar su origen y regularizar la registraci&oacute;n. Ante una fiscalizaci&oacute;n del fisco, es pasible de sanciones legales y econ&oacute;micas.`);
  }
  else if(l&&pct>0.1){
   let recTxt=`La diferencia de <b>${g}</b> es de <b>${fN(diff)} tn</b> (${fP(diff/l)}), lo cual excede el margen de error est&aacute;ndar del 10%. En caso de no poder justificar dicha diferencia, realizar las correcciones pertinentes; ya que ante una inspecci&oacute;n del fisco es pasible de sanciones legales y econ&oacute;micas.`;
   activeRecs.push(recTxt);
  }
  if(msi){
   let msiTxt='Se detectaron ';
   const parts=[];
   if(msi.ingreso>0)parts.push(`<b>${fN(msi.ingreso)} tn de ${g}</b> pendientes de ingreso`);
   if(msi.egreso>0)parts.push(`<b>${fN(msi.egreso)} tn de ${g}</b> pendientes de egreso`);
   msiTxt+=parts.join(' y ')+' al sistema. La existencia de mercader&iacute;a sin impactar implica que el stock registrado no refleja la realidad f&iacute;sica, lo cual ante una fiscalizaci&oacute;n de ARCA podr&iacute;a derivar en sanciones para la cooperativa por diferencias entre el stock f&iacute;sico y el declarado.';
   activeRecs.push(msiTxt);
  }
  // Check Cubicaje vs ARCA
  const hayA=tieneDato(gArca,g);
  if(hayA){
   const aVal=Number(gArca[g]);
   const cA=gCubA[g]||0;
   const diffA=cA-aVal;

   } else if(aVal&&Math.abs(diffA/aVal)>0.1){
    let recA=`Se observa una diferencia de <b>${fN(diffA)} tn de ${g}</b> entre el cubicaje f&iacute;sico (${fN(cA)} tn) y lo declarado ante ARCA (${fN(aVal)} tn), lo cual representa un desv&iacute;o del ${fP(diffA/aVal)}.`;

    activeRecs.push(recA);
   }
  }
 });

 csv+=txtPlano(s.nombre)+sep+'Celda'+sep+(e.grano||'')+sep+(e.pctLleno!=null?e.pctLleno+'%':'')+sep+(s.capacidad||'')+sep+(e.metodo||'')+sep+pe+(_fc.peLocal?' (propio)':'')+sep+''+sep+(r.kg/1000).toFixed(1)+sep+''+'\n';

 if(_hay.length){

 _egr.forEach(m=>{if(m?.grano&&m?.toneladas)csv+='Egreso pendiente'+sep+m.grano+sep+m.toneladas+sep+(m.obs||'')+'\n';});
 const _ti=_ing.reduce((a,m)=>a+(+m?.toneladas||0),0), _te=_egr.reduce((a,m)=>a+(+m?.toneladas||0),0);
 csv+='Total ingresos'+sep+''+sep+_ti.toFixed(1)+'\n';
 if(_te)csv+='Total egresos'+sep+''+sep+_te.toFixed(1)+'\n';
 csv+='\n';
 }
 });

 const blob=new Blob([csv],{type:'text/tab-separated-values;charset=utf-8'});
 shareOrDownload(blob,'cubicaje_'+(coop?.clave||'export').toLowerCase()+'_'+new Date().toISOString().slice(0,10)+'.xls','Cubicaje Excel');
};
